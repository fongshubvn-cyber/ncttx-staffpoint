<title>Thông tin đánh giá nhân sự</title>

<!-- Đọc và ghi tệp .xlsx ngay trong trình duyệt, để app tự điền vào phiếu
     thay vì bắt người ta copy dán từng cột. Nạp từ cdnjs vì đó là nơi duy nhất
     trang này được phép lấy mã về. Không có nó thì màn hình tự điền tự ẩn, mọi
     thứ còn lại vẫn chạy. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>

<style>
:root{
  --bg:#f7f9f1; --surface:#ffffff; --surface-2:#f2f6e8; --line:#e0e8d0;
  --ink:#22301c; --ink-2:#5e6b54; --ink-3:#8e9a83;
  --brand:#55842a; --brand-soft:#e6f0d4; --brand-ink:#3d6318;
  --star:#e0b93c; --ok:#3f7d54; --ok-soft:#e3f0e6;
  --warn:#8a6a12; --warn-soft:#f9f0cd; --bad:#a8452f; --bad-soft:#f8e6e2;
  --shadow:0 1px 2px rgba(34,48,28,.05),0 8px 24px rgba(34,48,28,.07);
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131710; --surface:#1c2118; --surface-2:#171c13; --line:#2e3728;
  --ink:#e8efe0; --ink-2:#a9b6a0; --ink-3:#7c8a75;
  --brand:#9bc85a; --brand-soft:#2a3520; --brand-ink:#c3e08e;
  --star:#e8cb63; --ok:#7bbd92; --ok-soft:#1f2d22;
  --warn:#dcc264; --warn-soft:#2f2a14; --bad:#e08d78; --bad-soft:#341f1a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#131710; --surface:#1c2118; --surface-2:#171c13; --line:#2e3728;
  --ink:#e8efe0; --ink-2:#a9b6a0; --ink-3:#7c8a75;
  --brand:#9bc85a; --brand-soft:#2a3520; --brand-ink:#c3e08e;
  --star:#e8cb63; --ok:#7bbd92; --ok-soft:#1f2d22;
  --warn:#dcc264; --warn-soft:#2f2a14; --bad:#e08d78; --bad-soft:#341f1a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em;line-height:1.25}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 96px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:9px;min-width:0}
.logo .mk{width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:16px;flex:none}
.logo-txt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.logo-txt b{font-weight:700;font-size:13.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo-txt i{font-style:normal;font-size:10.5px;color:var(--brand-ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:420px){.logo-txt b{font-size:12px}.logo-txt i{font-size:9.5px}}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.iconbtn{background:transparent;border:1px solid var(--line);border-radius:9px;width:32px;height:32px;display:grid;place-items:center;font-size:14px}
.iconbtn:hover{background:var(--surface-2)}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.mt{margin-top:14px}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--ink-2)}
.tiny{font-size:12.5px}
.sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:700;margin:22px 0 8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:12.5px;font-weight:650;color:var(--ink-2);margin-bottom:5px}
.input,select.input,textarea.input{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface-2);color:var(--ink);
}
textarea.input{min-height:76px;resize:vertical}
.input:focus{outline:2px solid var(--brand);outline-offset:-1px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.brand{background:var(--brand-soft);color:var(--brand-ink);border-color:transparent}
.empty{text-align:center;padding:34px 18px;color:var(--ink-3)}
.empty .big{font-size:30px;margin-bottom:6px}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- avatar ---------- */
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;flex:none;letter-spacing:.02em}
.av.lg{width:66px;height:66px;font-size:21px}
.av.sm{width:32px;height:32px;font-size:12px}

/* ---------- stars ---------- */
.diem{display:inline-flex;align-items:center;gap:3px;font-size:14px;line-height:1;white-space:nowrap}
.diem b{font-variant-numeric:tabular-nums;font-weight:750}
.diem-thang{font-size:11px;color:var(--ink-3)}
.diem-bar{display:inline-block;width:38px;height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-left:3px}
.diem-bar>i{display:block;height:100%;background:var(--star);border-radius:99px}
.bigscore{font-size:42px;font-weight:750;letter-spacing:-.03em;line-height:1}

/* ---------- rating bars ---------- */
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--star);border-radius:99px}
.dist-row{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;gap:9px;margin-bottom:6px;font-size:12.5px;color:var(--ink-2)}
.diemky{display:flex;align-items:baseline;gap:10px;margin:16px 0 0;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.diemky .ct{display:block;font-size:12px;color:var(--ink-2);margin-top:3px;line-height:1.4}
.diemky .ct b{font-variant-numeric:tabular-nums;font-weight:750}
.diemky .so{font-size:38px;font-weight:750;line-height:1;letter-spacing:-.03em;color:var(--brand)}
.bacot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
.bacot .cot{padding:14px 14px 6px;border-right:1px solid var(--line)}
.bacot .cot:first-child{padding-left:0}
.bacot .cot:last-child{border-right:0;padding-right:0}

/* Điện thoại: xếp dọc một cột, mỗi mục là nhãn bên trái số bên phải cho gọn. */
@media(max-width:700px){
  .bacot{grid-template-columns:1fr}
  .bacot .cot{padding:13px 0 11px;border-right:0;border-bottom:1px solid var(--line)}
  .bacot .cot:last-child{border-bottom:0;padding-bottom:2px}
  .cot-tit{margin-bottom:9px;color:var(--brand-ink);font-size:12px}
  .muc{display:grid;grid-template-columns:1fr auto;align-items:baseline;column-gap:12px;margin-bottom:11px}
  .muc .nhan{font-size:13.5px;color:var(--ink);grid-column:1;grid-row:1}
  .muc>.so{grid-column:2;grid-row:1;font-size:21px;margin-top:0;text-align:right}
  .muc .phu{grid-column:1 / -1;font-size:11px;margin-top:1px}
  .muc .chip-hang,.muc .sv{grid-column:1 / -1}
  .diemky{margin-top:14px;padding:11px 0}
  .diemky .so{font-size:34px}
}
.cot-tit{font-size:11.5px;color:var(--ink-3);margin-bottom:11px;font-weight:600}
.muc{margin-bottom:13px}
.muc .nhan{font-size:12.5px;color:var(--ink-2);line-height:1.3}
.muc .nhan b{color:var(--brand-ink);font-weight:750}
.muc>.so{font-size:25px;font-weight:750;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums}
.muc>.so.mo{color:var(--ink-3)}
.muc .phu{font-size:10.5px;color:var(--ink-3);margin-top:2px;line-height:1.35}
.luuy-ds{column-count:2;column-gap:26px}
.luuy-ds .mucnb{break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid}
.luuy-ds .mucnb:last-child{border-bottom:1px solid var(--line);margin-bottom:9px;padding-bottom:9px}
@media(max-width:700px){.luuy-ds{column-count:1}
 .luuy-ds .mucnb:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}}
.mucnb{margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.mucnb:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.mucnb .hd{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.mucnb .ma{font-size:11.5px;font-weight:750;color:var(--brand-ink);font-variant-numeric:tabular-nums}
.mucnb .d{margin-left:auto;font-size:15px;font-weight:750;font-variant-numeric:tabular-nums}
.mucnb .tx{font-size:12.5px;line-height:1.4;color:var(--ink-2)}
.kybox{margin-top:11px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ky{display:flex;align-items:center;gap:8px;padding:8px 11px;font-size:12.5px;color:var(--ink-3);border-bottom:1px solid var(--line)}
.ky:last-child{border-bottom:0}
.ky .grow{flex:1;min-width:0}
.ky b{font-weight:650}
.ky.da{color:var(--ok);background:var(--ok-soft)}
.ky.da b{color:var(--ok)}
.ky.bac{color:var(--bad);background:var(--bad-soft)}
.anh-xem{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.anh-o{position:relative;width:88px;height:88px;border-radius:9px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.anh-o img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.anh-o .bo{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;
  background:rgba(0,0,0,.6);color:#fff;font-size:11px;line-height:1;display:grid;place-items:center;padding:0}
.anh-o .dl{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;
  font-size:9px;text-align:center;padding:2px 0}
.knbox{margin-top:11px;padding:11px;border-radius:10px;background:var(--surface-2);border-left:3px solid var(--ink-3)}
.knbox.mo{background:var(--bad-soft);border-left-color:var(--bad)}
.tong{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  margin-top:12px;padding:8px 10px;border-radius:9px;background:var(--brand-soft);
  font-size:12.5px;font-weight:650;color:var(--brand-ink)}
.tong b{font-size:19px;font-weight:750;font-variant-numeric:tabular-nums;color:var(--brand-ink);flex:none}
.phu.ghichu{font-size:10.5px;color:var(--ink-3);margin-top:4px;line-height:1.35}
@media(max-width:700px){.tong{font-size:13.5px;padding:9px 11px}.tong b{font-size:20px}}
.chip-hang{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.sv{display:flex;align-items:baseline;gap:6px;margin-top:5px;font-size:12px;color:var(--ink-2)}
.sv .n{font-size:21px;font-weight:750;font-variant-numeric:tabular-nums}
.sv .n.ok{color:var(--ok)}
.sv .n.bad{color:var(--bad)}
.khung-row{margin-bottom:10px}
.khung-row .lab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;margin-bottom:4px}
.khung-row .nm{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.khung-row .nm b{color:var(--brand-ink);font-weight:700}
.khung-row .val{font-weight:750;font-variant-numeric:tabular-nums;flex:none;font-size:14px}
.khung-row .sub{font-size:11px;color:var(--ink-3);margin-top:3px}
.khung-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:18px 0 4px;font-size:13.5px;font-weight:650}
.khung-head b{color:var(--brand-ink)}
.khung-head .val{font-weight:750;font-variant-numeric:tabular-nums}
.phanbo{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.pb{font-size:10.5px;color:var(--ink-3);background:var(--surface-2);border-radius:6px;padding:2px 6px;white-space:nowrap}
.pb b{margin-left:3px;color:var(--ink-2)}
.pb.on{background:var(--warn-soft);color:var(--warn)}
.pb.on b{color:var(--warn)}
.crit-row{margin-bottom:12px}
.crit-row .lab{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;margin-bottom:5px}
.crit-row .lab b{font-weight:650}
.crit-row .val{font-variant-numeric:tabular-nums;font-weight:700;flex:none}

/* ---------- list items ---------- */
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;width:100%;background:transparent;border-left:0;border-right:0;border-top:0}
.item:last-child{border-bottom:0}
.item:hover{background:var(--surface-2)}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:650;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rankno{width:24px;text-align:center;font-weight:750;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
.rankno.top{color:var(--star)}

/* ---------- star picker ---------- */
.pick{display:flex;gap:6px}
.pick button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:17px;color:var(--ink-3);display:grid;place-items:center;padding:0}
.pick button.on{color:var(--star);background:var(--surface)}
.pick button.sel{border-color:var(--star);box-shadow:0 0 0 2px var(--warn-soft)}
.grp-sum{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:8px;font-size:14px;user-select:none}
.grp-sum::-webkit-details-marker{display:none}
.grp-sum:hover{background:var(--surface-2)}
.grp-sum .grow{flex:1;min-width:0;line-height:1.35}
.grp-sum::after{content:"▾";color:var(--ink-3);flex:none;transition:transform .15s}
details[open]>.grp-sum::after{transform:rotate(180deg)}
details[open]>.grp-sum{border-bottom:1px solid var(--line)}
.pick button.na{font-size:15px;font-weight:700;width:30px}
.pick button.na.sel{border-color:var(--ink-3);color:var(--ink-2);box-shadow:none}
.critbox{padding:14px;border-bottom:1px solid var(--line)}
.critbox:last-child{border-bottom:0}
.critbox .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:9px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:#fff}

/* ---------- bottom nav ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:760px;margin:0 auto;display:flex}
.nav button{flex:1;border:0;background:transparent;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--ink-3);position:relative}
.nav button .ic{font-size:19px;line-height:1}
.nav button[aria-selected="true"]{color:var(--brand)}
.badge{position:absolute;top:4px;right:50%;margin-right:-22px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:99px;display:grid;place-items:center;padding:0 4px}

/* ---------- login ---------- */
.login{min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:linear-gradient(180deg,var(--warn-soft) 0%,var(--bg) 55%)}
.login-card{width:100%;max-width:380px}
.demo-list{max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.nho{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);margin:2px 0 14px;cursor:pointer;user-select:none}
.nho input{width:17px;height:17px;accent-color:var(--brand);flex:none;cursor:pointer}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(20,16,12,.5);display:grid;place-items:end center;padding:0}
.modal-in{background:var(--surface);width:100%;max-width:760px;max-height:92dvh;overflow:auto;border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:0}
@media(min-width:640px){.modal{place-items:center}.modal-in{border-radius:18px;border-bottom:1px solid var(--line)}}
.modal-hd{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:10px;z-index:2}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);max-width:90vw;text-align:center}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.hide{display:none!important}
/* ---- Lịch sử ghi nhận & vi phạm: dạng xổ xuống ---- */
.lichsu{margin-top:18px}
.lichsu>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;
  padding:13px 15px;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--sh)}
.lichsu>summary::-webkit-details-marker{display:none}
.lichsu>summary::after{content:"▾";color:var(--ink-3);font-size:15px;transition:transform .18s}
.lichsu[open]>summary::after{transform:rotate(180deg)}
.lichsu>summary .dem{background:var(--brand-soft);color:var(--brand-ink);font-weight:700;
  font-size:13px;border-radius:20px;padding:3px 11px;flex:none}

/* ---- Mục cần phát huy và cải thiện: hai cột ---- */
.luuy-doi{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
@media (max-width:700px){.luuy-doi{grid-template-columns:1fr}}
.luuy-cot{border-radius:14px;padding:14px;box-shadow:var(--sh)}
.luuy-cot.ben-tot{background:var(--ok-soft);border:1px solid var(--ok)}
.luuy-cot.ben-xau{background:var(--bad-soft);border:1px solid var(--bad)}
.luuy-cot .cot-dau{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.luuy-cot .tit{font-weight:700;font-size:14.5px;flex:1}
.luuy-cot.ben-tot .tit{color:var(--ok)}
.luuy-cot.ben-xau .tit{color:var(--bad)}
.luuy-cot .soluong{font-weight:700;font-size:12.5px;border-radius:20px;padding:2px 10px;flex:none;
  background:rgba(0,0,0,.07)}
.luuy-cot .phu{font-size:12.5px;line-height:1.5;color:var(--ink-2);margin-bottom:10px}
.luuy-cot .rong{font-size:13px;color:var(--ink-2);padding:14px 4px;text-align:center;opacity:.8}

<script>
"use strict";
/* =========================================================================
   ĐIỂM NHÂN SỰ — app đánh giá nhân sự, thang điểm 1 tới 5
   ========================================================================= */

/* ---------------- 0. NỐI VỚI MÁY CHỦ TRÊN GOOGLE ----------------

   Dán đường dẫn Ứng dụng web của Apps Script vào đây khi triển khai. Để trống
   thì app tự rơi về kho dùng chung của nền tảng, rồi về localStorage.

   ⚠️ REPO CÔNG KHAI. GitHub Pages bản miễn phí đòi repo public, nên dòng dưới
   ai cũng đọc được. Chấp nhận được — nhưng CHỈ VÌ máy chủ tự canh:

     · token ký bằng HMAC, sửa một ký tự là hỏng chữ ký
     · mọi hàm tự kiểm vai, không tin gì màn hình gửi lên
     · việc đổi dữ liệu chỉ nhận qua POST, mật khẩu không đi qua đường dẫn

   Đường dẫn này KHÔNG phải mật khẩu, nhưng cũng đừng rao. Nghi lộ thì chạy
   appDoiKhoaKy() trên Apps Script — mọi phiên đang mở lập tức hết hiệu lực.

   Người dùng có thể trỏ sang máy chủ khác bằng ô trong màn hình Quản trị, ghi
   đè dòng này mà không phải sửa code. Tiện khi thử một bản triển khai mới. */

const API_MAC_DINH = "";        // ← dán https://script.google.com/.../exec vào đây

function apiUrl(){
  try { const t = (localStorage.getItem("ttx/api") || "").trim(); if (t) return t; }
  catch (e) {}
  return API_MAC_DINH;
}
function datApiUrl(u){
  try {
    if (u) localStorage.setItem("ttx/api", String(u).trim());
    else localStorage.removeItem("ttx/api");
    return true;
  } catch (e) { return false; }
}

/**
 * Gọi máy chủ.
 *
 * ⛔ VIỆC ĐỔI DỮ LIỆU PHẢI ĐI POST, và Content-Type phải là "text/plain".
 * Dùng "application/json" thì trình duyệt gửi một cuộc gọi OPTIONS dò đường
 * trước, mà Apps Script không trả lời OPTIONS — cuộc gọi thật chưa bao giờ đi,
 * và lỗi hiện ra là "network error" chẳng chỉ vào đâu cả.
 */
async function goiMayChu(viec, duLieu, laPost){
  const url = apiUrl();
  if (!url) throw new Error("Chưa nối máy chủ.");
  const d = Object.assign({ action: viec }, duLieu || {});

  let r;
  if (laPost){
    r = await fetch(url, { method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(d) });
  } else {
    r = await fetch(url + (url.indexOf("?") >= 0 ? "&" : "?") +
      new URLSearchParams(d).toString());
  }
  const j = await r.json();
  if (!j.ok) throw new Error(j.loi || j.error || "Máy chủ báo lỗi.");
  return j.data;
}

/* ---------------- 1. LỚP LƯU TRỮ ----------------

   BA ĐƯỜNG, thử theo thứ tự:

     mayChu   Apps Script trên Google, dữ liệu và ảnh nằm trong Drive.
              Đây là đường có phân quyền THẬT: máy chủ kiểm vai trước khi trả
              dữ liệu, nên nhân viên không đọc được biên bản của người khác dù
              có mở Console.

     chung    Kho dùng chung của nền tảng Artifact. Mọi người thấy cùng dữ
              liệu, nhưng ⛔ AI MỞ ĐƯỢC TRANG ĐỀU ĐỌC ĐƯỢC TẤT CẢ — màn hình
              có che theo vai, mà che không phải là chặn. Chỉ dùng để thử.

     local    localStorage. Dữ liệu chỉ nằm trên máy đang dùng.

   CHIA LÀM BỐN NGĂN, vì kho nặng 159 KB mà phần đổi hằng ngày chỉ 6 KB:

     tieuChi    134 KB   bộ câu hỏi, vài tháng mới sửa một lần
     nhanSu      18 KB   người, phòng ban, điểm làm việc, tuyến
     soSuViec     6 KB   biên bản, phiếu ghi nhận — đổi liên tục
     thamSo      nhỏ     ngưỡng, trọng số

   Lập một biên bản chỉ đẩy lại ngăn 6 KB. Nếu ghi cả cục 159 KB mỗi lần thì
   vừa chậm vừa dễ đè mất việc người khác vừa làm xong. Đường máy chủ thì gửi
   cả kho, vì bên đó tự lọc lại từng thay đổi theo vai người gửi.              */

const Storage = (() => {
  const NGAN = {
    tieuChi:  ["criteria"],
    nhanSu:   ["users", "depts", "sites", "tracks", "boundaries"],
    soSuViec: ["records", "reviews"],
    thamSo:   ["settings", "version"]
  };
  const TEN_NGAN = Object.keys(NGAN);
  const DUONG = t => "kho/" + t;

  let mode = "local";
  let kho;                       // undefined = chưa dò · null = không có
  let daGhi = {};                // ảnh chụp lần ghi trước, để bỏ qua ngăn không đổi
  let bao = "chưa dò";

  async function ketNoi() {
    if (kho !== undefined) return kho;
    kho = null;
    try {
      if (window.claude && typeof window.claude.use === "function") {
        kho = (await window.claude.use("db")) || null;
        bao = kho ? "kho chung: đã nối" : "kho chung: không dùng được ở đây";
      } else {
        bao = "kho chung: trang này không được cấp";
      }
    } catch (e) { kho = null; bao = "kho chung: lỗi nối — " + e.message; }
    return kho;
  }

  /* get() có thể trả thẳng dữ liệu, hoặc bọc trong .data, hoặc .data() là hàm.
     Không đoán — thử cả ba, cái nào ra object thì lấy. */
  function boc(snap) {
    if (snap == null) return null;
    if (typeof snap.data === "function") { try { return snap.data(); } catch (e) {} }
    if (snap.data !== undefined && snap.data !== null) return snap.data;
    if (snap.exists === false) return null;
    return snap;
  }

  /* ⛔ Kho chung trả về object ĐÓNG BĂNG. App thì sửa thẳng vào dữ liệu vừa đọc
     — nâng cấp bản cũ, gán lại vai theo cấp, thêm trường còn thiếu. Gán vào đồ
     đông lạnh là ném lỗi "Cannot assign to read only property" và app chết ngay
     màn hình đầu, không vào nổi.
     Nên chép hẳn ra một bản mới trước khi đưa cho app. Chép qua JSON là gọn
     nhất và cũng bỏ luôn mọi thứ không phải dữ liệu thuần. */
  function chepRa(o) {
    try { return JSON.parse(JSON.stringify(o)); } catch (e) { return null; }
  }

  /* Phiên với máy chủ: token do máy chủ cấp, ký bằng HMAC. Giữ trong
     localStorage để tải lại trang không phải đăng nhập lại. */
  const KHOA_TOKEN = "ttx/token";
  function token(){ try { return localStorage.getItem(KHOA_TOKEN) || ""; } catch (e) { return ""; } }
  function datToken(t){
    try { if (t) localStorage.setItem(KHOA_TOKEN, t); else localStorage.removeItem(KHOA_TOKEN); }
    catch (e) {}
  }
  const coMayChu = () => !!apiUrl();

  async function load() {
    // ── ĐƯỜNG 1: máy chủ trên Google ──
    if (coMayChu() && token()){
      try {
        const d2 = await goiMayChu("taiDuLieu", { token: token() }, false);
        mode = "mayChu";
        bao = "máy chủ Google: đang dùng, dữ liệu trong Drive";
        return d2;
      } catch (e) {
        // Phiên hết hạn thì để app hiện màn hình đăng nhập, đừng rơi về kho khác:
        // rơi xuống là người dùng thấy dữ liệu cũ của máy này mà tưởng là mới.
        datToken("");
        mode = "mayChu";
        bao = "máy chủ Google: " + e.message;
        return null;
      }
    }
    if (coMayChu()){ mode = "mayChu"; bao = "máy chủ Google: chưa đăng nhập"; return null; }

    const d = await ketNoi();
    if (d) {
      try {
        const ra = {};
        let coGi = false;
        for (const ten of TEN_NGAN) {
          let o = null;
          try { o = chepRa(boc(await d.doc(DUONG(ten)).get())); } catch (e) {}
          if (o && typeof o === "object") {
            coGi = true;
            daGhi[ten] = JSON.stringify(o);
            for (const k of NGAN[ten]) if (o[k] !== undefined) ra[k] = o[k];
          }
        }
        mode = "shared";
        return coGi ? ra : null;
      } catch (e) { bao = "kho chung: đọc hỏng — " + e.message; kho = null; }
    }
    mode = "local";
    try { const raw = localStorage.getItem("sao-nhan-su/v1"); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  }

  async function save(data) {
    // ── ĐƯỜNG 1: máy chủ. Gửi cả kho, bên đó tự lọc lại theo vai người gửi. ──
    if (coMayChu()){
      if (!token()) return false;
      try { await goiMayChu("luuDuLieu", { token: token(), db: data }, true); return true; }
      catch (e) { bao = "máy chủ Google: ghi hỏng — " + e.message; return false; }
    }

    const d = await ketNoi();
    if (d) {
      try {
        for (const ten of TEN_NGAN) {
          const o = {};
          for (const k of NGAN[ten]) if (data[k] !== undefined) o[k] = data[k];
          const s = JSON.stringify(o);
          if (s === daGhi[ten]) continue;          // ngăn này không đổi, bỏ qua
          await d.doc(DUONG(ten)).set(o);
          daGhi[ten] = s;
        }
        mode = "shared";
        return true;
      } catch (e) {
        bao = "kho chung: ghi hỏng — " + e.message;
        kho = null; mode = "local";
      }
    }
    try { localStorage.setItem("sao-nhan-su/v1", JSON.stringify(data)); return true; }
    catch (e) { return false; }
  }

  /* Nghe ngăn sổ sự việc. Người khác lập hay duyệt biên bản thì gọi lại fn.
     ⚠️ KHÔNG tự vẽ lại màn hình — ai đang gõ dở một biên bản sẽ mất chữ. Chỉ
     báo cho biết có cái mới, để họ tự bấm cập nhật. */
  async function ngheSoSuViec(fn) {
    const d = await ketNoi();
    if (!d) return;
    try {
      const doc = d.doc(DUONG("soSuViec"));
      if (typeof doc.onSnapshot !== "function") return;
      let lanDau = true;
      doc.onSnapshot(snap => {
        const o = boc(snap);
        if (!o) return;
        const s = JSON.stringify(o);
        if (lanDau) { lanDau = false; daGhi.soSuViec = s; return; }
        if (s === daGhi.soSuViec) return;          // chính mình vừa ghi
        try { fn(); } catch (e) {}
      });
    } catch (e) {}
  }

  return {
    load, save, ngheSoSuViec,
    coMayChu, token, datToken, goi: goiMayChu,
    probeReport: () => bao,
    get mode() { return mode; }
  };
})();

function fmtDate(iso){
  try{
    const d = new Date(iso), n = new Date(), ms = n - d, day = 864e5;
    if (ms < 6e4) return "vừa xong";
    if (ms < 36e5) return Math.floor(ms/6e4) + " phút trước";
    if (ms < day) return Math.floor(ms/36e5) + " giờ trước";
    if (ms < 7*day) return Math.floor(ms/day) + " ngày trước";
    return d.toLocaleDateString("vi-VN", {day:"2-digit", month:"2-digit", year:"numeric"});
  }catch(e){ return ""; }
}

/* ---------------- 2b. MẬT KHẨU ----------------
   Mật khẩu KHÔNG bao giờ được lưu dạng chữ thường. Mỗi tài khoản có một
   chuỗi muối riêng, chỉ lưu bản băm SHA-256 của (muối + mật khẩu). */
const MIN_PW = 6;
const genSalt = () => Math.random().toString(36).slice(2) + Date.now().toString(36);

async function hashPw(pw, salt){
  const s = salt + "::" + String(pw);
  try{
    if (typeof crypto !== "undefined" && crypto.subtle && crypto.subtle.digest){
      const buf = new TextEncoder().encode(s);
      const h = await crypto.subtle.digest("SHA-256", buf);
      return "s256:" + [...new Uint8Array(h)].map(b => b.toString(16).padStart(2,"0")).join("");
    }
  }catch(e){}
  // Dự phòng khi trình duyệt không có Web Crypto (hiếm) — yếu hơn nhưng vẫn không lưu chữ thường.
  let a = 0x811c9dc5, b = 0x01000193;
  for (let i = 0; i < s.length; i++){
    a = ((a ^ s.charCodeAt(i)) * 16777619) >>> 0;
    b = ((b + s.charCodeAt(i) * (i + 7)) * 2654435761) >>> 0;
  }
  return "fb:" + a.toString(16) + b.toString(16);
}
async function setPw(u, pw, mustChange){
  u.pwSalt = genSalt();
  u.pwHash = await hashPw(pw, u.pwSalt);
  u.mustChange = !!mustChange;
  u.pwSetAt = nowISO();
  return u;
}
async function checkPw(u, pw){
  if (!u || !u.pwSalt || !(u.pwHash || u.pwHashAlt)) return false;
  const h = await hashPw(pw, u.pwSalt);
  return h === u.pwHash || h === u.pwHashAlt;
}
function pwProblem(pw, confirm){
  if (!pw || pw.length < MIN_PW) return "Mật khẩu tối thiểu " + MIN_PW + " ký tự.";
  if (confirm !== undefined && pw !== confirm) return "Hai ô mật khẩu chưa khớp.";
  return null;
}
/** Ai được đặt lại mật khẩu cho ai. */
function canResetPw(actor, target){
  if (!actor || !target) return false;
  if (isAdmin(actor)) return true;
  if (actor.role === "manager") return target.role === "staff" && inScope(actor, target);
  return false;
}

const isAdmin   = u => u && u.role === "admin";
const isManager = u => u && (u.role === "manager" || u.role === "admin");

/** Người thuộc phạm vi phụ trách của một quản lý.
    Nhân sự chấm người làm cùng chỗ; quản lý phụ trách cả phòng ban của mình
    dù phòng đó nằm ở điểm làm việc khác — ví dụ Trưởng phòng ngồi Văn phòng
    nhưng đội của mình đứng ở Cửa hàng. */
function inScope(manager, x){
  if (!manager || !x || x.id === manager.id) return false;
  if (isAdmin(manager)) return true;
  const cungCho   = !!manager.siteId && x.siteId === manager.siteId;
  const cungPhong = isManager(manager) && !!manager.deptId && x.deptId === manager.deptId;
  return cungCho || cungPhong;
}
/** Những người trong tầm quản lý — dùng cho sổ biên bản, duyệt, đặt lại mật khẩu. */
function visibleUsers(u){
  if (!u) return [];
  if (isAdmin(u)) return DB.users.filter(x => x.id !== u.id);
  return DB.users.filter(x => inScope(u, x));
}

/* ---- AI LẬP ĐƯỢC BIÊN BẢN VÀ PHIẾU GHI NHẬN VỀ AI ----
   Chốt 28/8/2026. Trước đây chỉ lập được về người trong phạm vi của mình,
   nên một bạn ở Cửa hàng không nêu được sự việc về quản lý ngồi Văn phòng.
   Giờ mở thêm theo chiều lên: chuỗi cấp trên của chính mình, và cả Ban lãnh
   đạo. Sổ này phải đi được cả hai chiều thì mới là sổ chung của Nhà. */

const THU_TU_CAP = ["staff", "lead", "manager", "head", "clevel", "founder"];
const bacCua = u => Math.max(0, THU_TU_CAP.indexOf((u || {}).level));
/** Ban lãnh đạo: cấp trên của tất cả mọi người, bất kể phòng ban. */
const laBanLanhDao = u => !!u && (u.level === "clevel" || u.level === "founder");

/** Người này có phải cấp trên của tôi không. */
function laCapTren(toi, x){
  if (!toi || !x || x.id === toi.id) return false;
  if (laTaiKhoanMay(x)) return false;
  if (bacCua(x) <= bacCua(toi)) return false;      // phải cao hơn thật
  if (laBanLanhDao(x)) return true;                // Ban lãnh đạo, ai cũng nêu được
  const cungPhong = !!toi.deptId && x.deptId === toi.deptId;
  const cungCho   = !!toi.siteId && x.siteId === toi.siteId;
  return cungPhong || cungCho;
}

/** Tài khoản máy, không phải người. Không ai lập biên bản về chúng được. */
const ID_TAI_KHOAN_MAY = ["u_admin", "u_admin_test"];
const laTaiKhoanMay = u => !!u && ID_TAI_KHOAN_MAY.indexOf(u.id) >= 0;

/** Danh sách người mà tôi lập được biên bản hoặc phiếu ghi nhận về họ.
    Chốt 28/8/2026: KHÔNG còn ranh giới phạm vi. Ai cũng nêu được sự việc
    về bất kỳ ai trong Nhà. Loại trừ đúng ba thứ: chính mình, tài khoản máy,
    và tài khoản thử đối với người thật. */
function nguoiLapDuoc(u){
  if (!u) return [];
  return DB.users.filter(x =>
    x.id !== u.id && x.active !== false && !laTaiKhoanMay(x)
  );
}

/** Xếp người vào nhóm để tìm cho nhanh khi danh sách dài. */
function nhomCuaNguoi(toi, x){
  if (isDemo(x)) return "🧪 Tài khoản thử";
  if (laCapTren(toi, x)) return "Cấp trên của bạn";
  if (!!toi.deptId && x.deptId === toi.deptId) return "Cùng bộ phận";
  if (!!toi.siteId && x.siteId === toi.siteId) return "Cùng điểm làm việc";
  return "Bộ phận khác";
}
/* Tài khoản thử xuống cuối, để không ai chọn nhầm khi đang vội. */
const THU_TU_NHOM = ["Cấp trên của bạn", "Cùng bộ phận", "Cùng điểm làm việc",
                     "Bộ phận khác", "🧪 Tài khoản thử"];

/* Ma trận đánh giá theo cấp bậc:
     Nhân viên   không đánh giá ai, cũng không tự đánh giá mình
     Lead        đánh giá nhân viên cùng bộ phận
     Quản lý     đánh giá Lead và nhân viên trong tầm mình
     Trưởng phòng đánh giá Quản lý trong tầm mình, và đánh giá chéo Trưởng phòng khác
     C-Level     đánh giá Trưởng phòng
     Founder     đánh giá C-Level và Trưởng phòng                                   */
function canRate(a, b){
  if (!a || !b || a.id === b.id) return false;      // không ai tự đánh giá mình
  if (b.active === false) return false;
  switch (a.level){
    case "staff":   return false;
    case "lead":    return b.level === "staff" && !!a.deptId && b.deptId === a.deptId;
    case "manager": return (b.level === "staff" || b.level === "lead") && inScope(a, b);
    case "head":    return (b.level === "manager" && inScope(a, b)) || b.level === "head";
    case "clevel":  return b.level === "head";
    case "founder": return b.level === "clevel" || b.level === "head";
    default:        return false;
  }
}
const ratableUsers = u => DB.users.filter(x => canRate(u, x));
/** Ai được phép đánh giá người này — để giải thích khi không có ai. */
const ratersOf = u => DB.users.filter(x => x.active !== false && canRate(x, u));
/** Đánh giá của nhân sự cần duyệt; của quản lý/admin thì tự động duyệt. */
const autoApprove = u => isManager(u);
/** Quản lý duyệt đánh giá trong cửa hàng mình; admin duyệt tất cả. */
function pendingForMe(){
  if (!isManager(ME)) return [];
  return DB.reviews.filter(r => {
    if (r.status !== "pending") return false;
    if (isAdmin(ME)) return true;
    return inScope(ME, user(r.revieweeId));
  }).sort((a,b) => b.createdAt.localeCompare(a.createdAt));
}
/** Người này có giữ vai trò quản lý theo khung không — Lead trở lên. */
const MGMT_LEVELS = ["founder","clevel","head","manager","lead"];
const hasMgmtRole = u => !!u && MGMT_LEVELS.includes(u.level);
/* Thang cấp bậc của Nhà, đánh số như trong phiếu. Phạm vi áp dụng của tiêu chí
   ghi "Từ bậc 6 (Trưởng phòng) trở lên", "Từ bậc 4 (Lead bộ phận) trở lên"…
   nên phải so bằng SỐ, không liệt kê tên cấp. */
const BAC_CAP = {
  founder: 9, ceo: 8, clevel: 7, head: 6,
  manager: 5,   // Quản lý khối
  expert:  5,   // Chuyên gia
  lead:    4,   // Lead bộ phận
  senior:  4,   // Chuyên viên — ngang Lead, cùng tiền
  shift:   3,   // Trưởng ca
  staff:   2,   // Nhân viên
  intern:  1    // Tập sự
};
const bacCapCua = u => (u && BAC_CAP[u.level]) || 0;
const tuBac = (u, n) => bacCapCua(u) >= n;
/** Từ bậc 6 (Trưởng phòng) trở lên. */
const isLv6 = u => tuBac(u, 6);
/** Vị trí có đầu việc tại điểm bán. */
const atPos = u => { const s = u && site(u.siteId); return !!(s && s.isPos); };

function scopeMatches(scope, u){
  // "lv<N>" là ngưỡng cấp: từ thứ hạng N trở lên. Nhận mọi mức, khỏi phải
  // thêm case mỗi lần Nhà mở thêm một cấp.
  const m = /^lv(\d+)$/.exec(String(scope || ""));
  if (m) return tuBac(u, Number(m[1]));
  switch (scope){
    case "mgmt":    return hasMgmtRole(u);
    case "lv6":     return isLv6(u);
    case "pos":     return atPos(u);
    case "hearing": return u.hearing === "hearing";
    case "deaf":    return u.hearing === "deaf";
    default:        return true;
  }
}

/** Bộ câu hỏi áp dụng cho một người:
    khung chung cho mọi người + câu của đúng tuyến người đó;
    ngạch quản lý chỉ dành cho người giữ vai trò quản lý. */
function criteriaFor(target){
  if (!target) return [];
  return DB.criteria.filter(c => {
    if (c.active === false) return false;
    if (c.appliesTo) return c.appliesTo.includes(target.role === "admin" ? "manager" : target.role);
    if (c.trackId && c.trackId !== target.trackId) return false;
    const tk = track(target.trackId);
    if (!c.trackId){
      // Một hành vi chỉ chấm một chỗ: tuyến nào đã đo nhóm này ở ngạch riêng thì bỏ ở khung chung.
      if (tk && (tk.noGroups || []).includes(c.gcode)) return false;
      return scopeMatches(c.scope, target);
    }
    // Câu thuộc chính tuyến của người này.
    // Ngạch quản lý chỉ áp cho người thật sự giữ vai trò quản lý — Lead trở lên.
    // Tuyến nào muốn cả tuyến cùng chấm ngạch quản lý thì bật "cả tuyến chấm
    // ngạch quản lý" ở Quản lý → Tuyến. Mặc định TẮT.
    if (tk && tk.qlForAll) return true;
    if (c.ngach === "quan_ly" && !hasMgmtRole(target)) return false;
    return scopeMatches(c.scope, target);
  });
}

/** Gom tiêu chí theo nhóm, giữ nguyên thứ tự gốc. */
function groupCriteria(list){
  const out = [], idx = {};
  list.forEach(c => {
    const k = (c.trackId || "kc") + "/" + (c.ngach || "") + "/" + (c.gcode || c.group);
    if (idx[k] === undefined){
      idx[k] = out.length;
      out.push({ key:k, gcode:c.gcode, name:c.group, mode:c.mode,
                 trackId:c.trackId, ngach:c.ngach, items:[] });
    }
    out[idx[k]].items.push(c);
  });
  return out;
}
const ngachLabel = (tid, ng) => {
  if (ng === "quan_ly") return "Ngạch quản lý";
  const t = track(tid);
  const first = t && (t.ngach || [])[0];
  return "Ngạch " + (first === "tay_nghe" ? "tay nghề" : "chuyên môn");
};
const sectionLabel = g => g.trackId ? (trackName(g.trackId) + " · " + ngachLabel(g.trackId, g.ngach)) : "Khung chung";

/* ---------------- 6b. SỔ BIÊN BẢN VÀ PHIẾU GHI NHẬN ----------------
   Sự việc có thật, đã được quản lý duyệt, gắn vào đúng một mã câu.
   Mỗi biên bản trừ 1 điểm câu đó, mỗi ghi nhận cộng 1, tính trong kỳ. */
const REC_KIND = {

  ghi_nhan: { nhan:"Phiếu ghi nhận",   dau:+1, cls:"ok",   icon:"🌟", mode:"ghi_nhan" }
};
const thisPeriod = () => new Date().toISOString().slice(0, 7);       // "2026-08"
const periodLabel = k => { const [y,m] = String(k||"").split("-"); return m ? ("Tháng " + Number(m) + "/" + y) : "—"; };
/**
 * Danh sách kỳ để chọn: BA THÁNG GẦN NHẤT, cộng mọi kỳ đã có dữ liệu.
 *
 * ⚠️ Bản đầu chỉ liệt kê tháng này cộng những tháng ĐÃ CÓ bản ghi. Nghe thì
 * gọn, nhưng nó khoá mất việc thật: đầu tháng 9 muốn xuất kết quả tháng 8 mà
 * tháng 8 chưa ai lập biên bản nào thì tháng 8 không hiện ra để chọn — trong
 * khi đó chính là kỳ cần xuất, và "cả tháng không ai vi phạm" là một kết quả
 * hợp lệ chứ không phải chỗ trống.
 *
 * Bản sau đó mở 12 tháng, nhưng dài quá mức cần. Việc thật chỉ có hai kiểu:
 * chốt kỳ vừa xong, hoặc nhìn lại toàn bộ. Nên còn ba tháng, và ai cần xa hơn
 * thì chọn "Tất cả các kỳ" ở màn hình Thống kê. Kỳ cũ đã có dữ liệu vẫn giữ
 * trong danh sách, để số liệu đã nhập không bao giờ biến mất khỏi tầm với.
 */
function allPeriods(){
  const set = new Set();
  const d = new Date();
  for (let i = 0; i < 3; i++){
    set.add(new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() - i, 1))
      .toISOString().slice(0, 7));
  }
  (DB.records || []).forEach(r => { if (r.period) set.add(r.period); });
  (DB.reviews || []).forEach(r => { if (r.period) set.add(r.period); });
  return [...set].sort().reverse();
}

const recs = () => DB.records || (DB.records = []);
/** Bản ghi đã duyệt của một người trong một kỳ. */
/** Sự việc đã duyệt của một người trong kỳ.

}
/** Vi phạm ranh giới đã duyệt — chặn mọi kết quả của kỳ đó. */

/* Một bản ghi cần ĐỦ HAI CHỮ KÝ mới có hiệu lực:

/* LUẬT DUYỆT — chốt 28/8/2026, thay cho lối hai chữ ký cũ.
   Biên bản vi phạm : có hiệu lực NGAY khi lập, không ai phải ký.

/** Loại có hiệu lực ngay, không qua ai. */
const tuDuyet = r => !!r && r.type === "vi_pham";

function canKyNS(me, r){

/* ---- HẠN KHÁNG NGHỊ ----
   Hai ngày làm việc TRÒN kể từ ngày lập. Ngày lập không tính.
   Lập bất kỳ giờ nào thứ Hai thì hết hạn 23:59 thứ Tư.
   Ngày làm việc mặc định thứ Hai tới thứ Sáu, sửa ở Quản lý → Tham số. */
const NGAY_LAM_MAC_DINH = [1, 2, 3, 4, 5];
const SO_NGAY_KHANG_NGHI = 2;
const ngayLamViec = () => {
  const t = (DB.settings || {}).ngayLamViec;
  return Array.isArray(t) && t.length ? t : NGAY_LAM_MAC_DINH;
};
const TEN_THU = ["Chủ nhật","Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy"];

/** Thời điểm hết hạn kháng nghị, hoặc null nếu không tính được. */
function hanKhangNghi(r){
  if (!r || !r.createdAt) return null;
  const d = new Date(r.createdAt);
  if (isNaN(d.getTime())) return null;
  const lam = ngayLamViec();
  const cur = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  let dem = 0, canh = 0;
  while (dem < SO_NGAY_KHANG_NGHI && canh < 90){
    cur.setDate(cur.getDate() + 1); canh++;
    if (lam.indexOf(cur.getDay()) >= 0) dem++;
  }
  if (dem < SO_NGAY_KHANG_NGHI) return null;
  cur.setHours(23, 59, 59, 999);
  return cur;
}
const conHanKhangNghi = r => {
  const h = hanKhangNghi(r);
  return !!h && Date.now() <= h.getTime();
};
/** Còn bao lâu, viết cho người đọc. */
function conLaiChu(r){
  const h = hanKhangNghi(r);
  if (!h) return "";
  const ms = h.getTime() - Date.now();
  if (ms <= 0) return "đã hết hạn";
  const gio = Math.floor(ms / 3600000);
  if (gio >= 24) return "còn " + Math.floor(gio / 24) + " ngày " + (gio % 24) + " giờ";
  if (gio >= 1)  return "còn " + gio + " giờ";
  return "còn " + Math.max(1, Math.floor(ms / 60000)) + " phút";
}
/** Biên bản về tôi còn trong hạn kháng nghị và tôi chưa kháng nghị. */
function bienBanCanChuY(){
  if (!ME) return [];
  return recs().filter(r =>
    r.subjectId === ME.id && r.type === "vi_pham" &&
    r.status !== "rejected" && !r.khieuNai && conHanKhangNghi(r)
  ).sort((a, b) => (hanKhangNghi(a) - hanKhangNghi(b)));
}
const nhanTrangThai = r =>
  r.status === "approved" ? (tuDuyet(r) ? "có hiệu lực" : "Nhân sự đã duyệt")

/** Mọi nhân sự đang làm việc đều lập được biên bản và phiếu ghi nhận

/** Admin lập thì có hiệu lực ngay; quản lý lập thì cần một người khác duyệt. */
const recAutoApprove = u => isAdmin(u);

/** Bản ghi chờ duyệt thuộc thẩm quyền của người đang đăng nhập.

/** Danh sách ranh giới áp cho một người: phần chung cộng phần riêng tuyến. */

/* Tham số chấm điểm. Sửa ở Quản lý → Tham số, mọi hồ sơ tính lại theo.

/* Ba khung của một phiếu. B.1 áp cho mọi người, B.2 và B.3 theo tuyến. */

/* ---- CÁCH TÍNH ĐIỂM, khớp với Phiếu đánh giá tháng ----
   Chốt 31/8/2026, đọc từ chính phiếu của Nhà.

   Mỗi CÂU có khởi điểm riêng theo chiều đo của nhóm chứa nó:
     · nhóm đo VI PHẠM  → khởi 5, "chưa có biên bản nào", mỗi biên bản kéo xuống 1
     · nhóm đo GHI NHẬN → khởi 0, "chưa ghi nhận lần nào", mỗi phiếu đẩy lên 1
   Điểm câu kẹp trong 0–5.

   Điểm một phần = TRUNG BÌNH điểm các câu THUỘC PHẠM VI của phần đó.
   Điểm tổng     = ghép ba phần theo trọng số, không chia đều. Thang 0–5.
   Bậc cách làm việc = tra ngưỡng theo tỷ lệ đạt = điểm tổng chia 5.     */
const SCORE_MAC_DINH = {
  // MỖI CÂU CHẤM THEO THANG 0–5, đúng như Phiếu đánh giá tháng của Nhà.
  // Điểm một phần = TRUNG BÌNH các câu thuộc phạm vi, khớp SUMIF/COUNTIF của phiếu.
  khoiViPham: 5,      // câu đo lỗi: đầu kỳ coi như đạt chuẩn, biên bản kéo xuống
  khoiGhiNhan: 0,     // câu đo ghi nhận: đầu kỳ 0, phải được ghi nhận mới có
  penalty: 1,         // mỗi biên bản trừ bao nhiêu điểm của câu đó
  bonus: 1,           // mỗi phiếu ghi nhận cộng bao nhiêu điểm cho câu đó
  floor: 0, cap: 5,   // sàn và trần của MỘT câu
  // Trọng số ghép ba phần. Mỗi bộ phải cộng lại đúng 100.
  // Khoá phải trùng KHUNG[].k của app: kc = khung chung, cm = chuyên môn, ql = quản lý.
  tsQL: { kc: 50, cm: 20, ql: 30 },   // người CÓ giữ vai trò quản lý
  ts:   { kc: 65, cm: 35 },           // người KHÔNG giữ vai trò quản lý
  // Ngưỡng tỷ lệ đạt để ra bậc 1 tới 5, tính bằng phần trăm.
  nguongBac: [0, 40, 55, 70, 85],
  /* Hệ số nhân vào phần P2 của cấp, tra theo Bậc cách làm việc 1 tới 5.
     Đây là chỗ DUY NHẤT trong cả hệ chạm tới tiền hằng tháng, nên số ở đây
     phải khớp với sheet ⚙️ Tham số của file gốc. Đổi ở một nơi thì phải đổi
     ở cả hai. */
  heSoP2: [0.10, 0.40, 0.90, 1.00, 1.10]
};

/** Điểm của MỘT câu trong kỳ, theo đúng luật phiếu. */
function diemCua(c, sv, cfg){
  cfg = cfg || scoreCfg();
  const ds = sv || [];
  const vp = ds.filter(e => e.type === "vi_pham" && !e.isBoundary).length;
  const gn = ds.filter(e => e.type === "ghi_nhan").length;
  const khoi = c.mode === "ghi_nhan" ? cfg.khoiGhiNhan : cfg.khoiViPham;
  const tho = khoi + gn * cfg.bonus - vp * cfg.penalty;
  return {
    khoi: khoi, viPham: vp, ghiNhan: gn, tho: tho,
    diem: Math.max(cfg.floor, Math.min(cfg.cap, tho)),
    kep: tho !== Math.max(cfg.floor, Math.min(cfg.cap, tho))
  };
}

/** Quy TỶ LỆ ĐẠT (0–100) ra Bậc cách làm việc 1–5. */
function bacCachLamViec(tyLe, cfg){
  cfg = cfg || scoreCfg();
  if (tyLe === null || tyLe === undefined) return null;
  let bac = 1;
  (cfg.nguongBac || []).forEach((n, i) => { if (tyLe >= n) bac = i + 1; });
  return bac;
}
/** Tạm ẩn phần đồng nghiệp chấm điểm nhau. Dữ liệu cũ vẫn giữ, chỉ ẩn giao diện. */
const anDanhGia = () => (DB.settings || {}).anDanhGia !== false;
function scoreCfg(){
  return Object.assign({}, SCORE_MAC_DINH, (DB.settings || {}).scoring || {});
}

function statsOf(userId, period){
  period = period || VIEW.period || thisPeriod();
  const rs = approvedFor(userId, period);
  const target = user(userId);
  const cs = target ? criteriaFor(target) : DB.criteria;
  const evs = recordsOf(userId, period);
  const byCrit = {};
  evs.forEach(e => { (byCrit[e.critId] = byCrit[e.critId] || []).push(e); });

  // Điểm từng câu chỉ đến từ đánh giá. Sự việc không tạo thêm câu mới,
  // để việc được ghi nhận không bao giờ kéo trung bình xuống.
  const perCrit = [];
  cs.forEach(c => {
    const vals = rs.map(r => r.scores[c.id]).filter(v => typeof v === "number");
    if (!vals.length) return;
    perCrit.push({ crit:c, avg: vals.reduce((a,b)=>a+b,0)/vals.length,
                   n: vals.length, events: byCrit[c.id] || [] });
  });
  // Nền = trung bình cộng điểm của từng CẤP người chấm.
  // Mỗi cấp một phiếu ngang nhau, bất kể cấp đó có mấy người chấm.
  const cfg = scoreCfg();
  const theoCap = {};
  rs.forEach(r => {
    const rv = user(r.reviewerId); if (!rv) return;
    const v = Object.values(r.scores).filter(x => typeof x === "number");
    if (!v.length) return;
    const lv = rv.level || "staff";
    (theoCap[lv] = theoCap[lv] || { lv, luot: [], nguoi: [] });
    theoCap[lv].luot.push(v.reduce((a,b) => a+b, 0) / v.length);
    theoCap[lv].nguoi.push(rv.name);
  });
  const THU_TU_CAP = ["founder","clevel","head","manager","lead","staff"];
  const perLevel = THU_TU_CAP.filter(k => theoCap[k]).map(k => {
    const t = theoCap[k];
    return { lv:k, ten: levelName(k) + " đánh giá", tb: t.luot.reduce((a,b)=>a+b,0)/t.luot.length,
             soLuot: t.luot.length, nguoi: t.nguoi };
  });
  const nen = perLevel.length
    ? perLevel.reduce((a,x) => a + x.tb, 0) / perLevel.length
    : cfg.base;

  // ---- ĐIỂM TỪNG CÂU, theo đúng luật phiếu ----
  // Câu đo lỗi khởi 5 rồi trừ dần, câu đo ghi nhận khởi 0 rồi cộng dần.
  const diemCau = {};
  cs.forEach(c => { diemCau[c.id] = diemCua(c, byCrit[c.id], cfg); });

  // ---- ĐIỂM TỪNG PHẦN: khởi điểm rồi cộng dồn sự việc, KHÔNG chia số câu ----
  const perKhung = KHUNG.map(kh => {
    const apDung = cs.filter(kh.thuoc);
    const sv     = evs.filter(e => { const c = crit(e.critId); return !!c && kh.thuoc(c); });
    const viPham  = sv.filter(e => e.type === "vi_pham"  && !e.isBoundary).length;
    const ghiNhan = sv.filter(e => e.type === "ghi_nhan").length;
    const items   = apDung.map(c => ({
      crit: c, avg: diemCau[c.id].diem, chiTiet: diemCau[c.id],
      events: byCrit[c.id] || []
    }));
    // TRUNG BÌNH các câu thuộc phạm vi — đúng công thức SUMIF/COUNTIF của phiếu.
    const toiDa = apDung.length * cfg.cap;
    const dat   = apDung.length ? items.reduce((a, x) => a + x.avg, 0) : null;
    const khoiDat = apDung.length
      ? apDung.reduce((a, c) => a + (c.mode === "ghi_nhan" ? cfg.khoiGhiNhan : cfg.khoiViPham), 0)
      : null;
    const tb    = dat === null ? null : dat / apDung.length;
    const tyLe  = tb === null || !cfg.cap ? null : tb / cfg.cap * 100;
    return {
      k: kh.k, ma: kh.ma, ten: khungTen(kh.k, target),
      soApDung: apDung.length,
      soDaCham: items.filter(x => x.events.length).length,   // số câu ĐÃ có sự việc
      soDoLoi:  apDung.filter(c => c.mode !== "ghi_nhan").length,
      soDoGhiNhan: apDung.filter(c => c.mode === "ghi_nhan").length,
      viPham: viPham, ghiNhan: ghiNhan,
      items: items.filter(x => x.events.length),   // chỉ liệt kê câu có động tĩnh
      moiItem: items,
      dat: dat, toiDa: toiDa, khoiDat: khoiDat, tyLe: tyLe,
      khoiTb: apDung.length ? khoiDat / apDung.length : null,
      dieuChinh: dat === null ? 0 : dat - khoiDat,
      tb: tb, kep: false
    };
  }).filter(x => x.soApDung > 0);

  // ---- ĐIỂM TỔNG: ghép ba phần theo TRỌNG SỐ, không chia đều ----
  const laQL = hasMgmtRole(target);
  const bangTS = laQL ? cfg.tsQL : cfg.ts;
  const phanCo = perKhung.filter(x => x.tb !== null && (bangTS[x.k] || 0) > 0);
  const tongTS = phanCo.reduce((a, x) => a + bangTS[x.k], 0);
  const perKhungTS = perKhung.map(x => Object.assign({}, x, {
    ts: bangTS[x.k] || 0,
    tsThuc: tongTS ? (bangTS[x.k] || 0) / tongTS * 100 : 0,
    gopVao: tongTS && x.tb !== null ? x.tb * (bangTS[x.k] || 0) / tongTS : 0
  }));
  const ngachCo  = perKhung.filter(x => x.tb !== null);
  // Ghép ĐIỂM các khung theo trọng số — cả ba cùng thang 0–5 nên cộng thẳng được.
  const tbNgach   = tongTS ? phanCo.reduce((a, x) => a + x.tb * bangTS[x.k], 0) / tongTS : null;
  const tyLeTong  = tbNgach === null || !cfg.cap ? null : tbNgach / cfg.cap * 100;
  const datTong   = phanCo.reduce((a, x) => a + x.dat, 0);
  const toiDaTong = phanCo.reduce((a, x) => a + x.toiDa, 0);

  const laB2 = e => { const c = crit(e.critId); return !!c && c.ngach === "chuyen_mon"; };
  const evsB2 = evs.filter(laB2);
  const soViPham  = evs.filter(e => e.type === "vi_pham"  && !e.isBoundary).length;
  const soGhiNhan = evs.filter(e => e.type === "ghi_nhan").length;
  const phat   = soViPham  * cfg.penalty;
  const thuong = soGhiNhan * cfg.bonus;

  // Điểm tổng tháng, thang 0–5. Đánh giá đang ẩn thì chính là điểm ghép trọng số;
  // bật lại thì trung bình thêm phần người chấm cho.
  const phan = anDanhGia()
    ? [tbNgach].filter(x => x !== null)
    : [tbNgach, perLevel.length ? nen : null].filter(x => x !== null);
  const raw  = phan.length ? phan.reduce((a,b) => a + b, 0) / phan.length : null;
  const avg  = raw === null ? cfg.khoiGhiNhan : Math.max(cfg.floor, Math.min(cfg.cap, raw));
  // Tỷ lệ đạt cuối cùng — cái quyết định Bậc.
  const tyLeCuoi = raw === null || !cfg.cap ? null : raw / cfg.cap * 100;

  // Bậc cách làm việc, và hai thứ chặn nó: vi phạm bảo mật thu nhập trừ thẳng 1 bậc,
  // vi phạm ranh giới thì chặn cả kết quả.
  const viPhamBaoMat = evs.some(e => /^BM/i.test(String(e.critCode || "")));
  const bacTho = bacCachLamViec(tyLeCuoi, cfg);
  const bac = bacTho === null ? null : Math.max(1, bacTho - (viPhamBaoMat ? 1 : 0));
  // phân bố điểm: lấy điểm trung bình mỗi lượt đánh giá, làm tròn
  const dist = [0,0,0,0,0];
  rs.forEach(r => {
    const v = Object.values(r.scores).filter(x => typeof x === "number");
    if (!v.length) return;
    const m = Math.round(v.reduce((a,b)=>a+b,0)/v.length);
    dist[Math.min(5, Math.max(1, m)) - 1]++;
  });
  // gộp theo nhóm tiêu chí để hồ sơ đọc được thay vì hàng chục thanh rời
  const gmap = {}, perGroup = [];
  perCrit.forEach(pc => {
    const c = pc.crit;
    const k = (c.trackId || "kc") + "/" + (c.ngach || "") + "/" + (c.gcode || c.group);
    if (!gmap[k]){
      gmap[k] = { key:k, gcode:c.gcode, name:c.group, mode:c.mode,
                  trackId:c.trackId, ngach:c.ngach, items:[], avg:0 };
      perGroup.push(gmap[k]);
    }
    gmap[k].items.push(pc);
  });
  perGroup.forEach(g => { g.avg = g.items.reduce((a,x) => a + x.avg, 0) / g.items.length; });

  const sorted = perCrit.slice().sort((a,b) => b.avg - a.avg);
  const blockers = blockersOf(userId, period);
  return {
    avg, count: rs.length, reviews: rs, perCrit, perGroup, dist,
    cuaAi: userId,
    period, events: evs, eventsB2: evsB2, perKhung: perKhungTS, perLevel,
    nen, tbNgach, tbDanhGia: perLevel.length ? nen : null,
    tyLeTong, tyLeCuoi, datTong, toiDaTong, thangPhieu: cfg.cap,
    perKhungTS, bac, bacTho, viPhamBaoMat, laQL, bangTS, tongTS, diemCau,
    phat, thuong, raw, cfg,
    kep: raw !== avg,
    nViPham: soViPham, nGhiNhan: soGhiNhan,
    blockers,
    blocked: blockers.length > 0,
    hasData: rs.length > 0 || evs.length > 0,
    strengths: sorted.slice(0,3),
    weaknesses: sorted.slice(-5).reverse().filter(x => x.avg < 4.6),
    tier: tierOf(avg, rs.length, { blocked: blockers.length > 0, hasData: rs.length > 0 || evs.length > 0 })
  };
}
function leaderboard(scope){
  const pool = DB.users.filter(u => u.active !== false && u.role !== "admin" && !isDemo(u))
                       .filter(u => scope === "all" || u.siteId === scope);
  // Xếp theo TỶ LỆ ĐẠT, vì ba khung thang khác nhau nên không so điểm thô được.
  const canCan = st => st.tyLeTong === null || st.tyLeTong === undefined ? -1 : st.tyLeTong;
  return pool.map(u => ({ u, st: statsOf(u.id) }))
             .sort((a, b) =>
               (b.st.hasData && !b.st.blocked) - (a.st.hasData && !a.st.blocked) ||
               // Đánh giá đang ẩn thì xếp theo cán cân sự việc, không theo điểm.
               (anDanhGia() ? canCan(b.st) - canCan(a.st) : b.st.avg - a.st.avg) ||
               ((b.st.nGhiNhan || 0) - (b.st.nViPham || 0)) - ((a.st.nGhiNhan || 0) - (a.st.nViPham || 0)));
}

/* ---------------- 8. GIAO DIỆN ---------------- */

/* ---- CHUÔNG THÔNG BÁO ----
   Mọi việc cần chú ý đều dồn về đây thay vì rải khắp các trang.
   Hai nhóm: việc cần bạn làm gì đó, và việc chỉ để biết.
   Số trên chuông chỉ đếm nhóm đầu, để nó không kêu suốt vì những thứ đã xong. */

function thongBao(){
  const lam = [], biet = [];
  if (!ME) return { lam, biet };
  const per = VIEW.period || thisPeriod();

  // 1. Biên bản về mình còn hạn kháng nghị
  bienBanCanChuY().forEach(r => {
    const c = crit(r.critId) || {};
    lam.push({
      ic:"⚠️", cls:"gap", tit:"Biên bản vi phạm về bạn",
      ma:r.critCode, nhom:c.group || "",
      mo:(r.detail || "").slice(0, 120),
      phu:"⏳ " + conLaiChu(r) + " · hết hạn " + fmtHan(hanKhangNghi(r)),
      luc:r.createdAt,
      nut:'<button class="btn bad sm" data-rec-kn="' + r.id + '">Không đồng ý — gửi Nhân sự</button>'
    });
  });

  // 2. Phiếu ghi nhận mới về mình trong kỳ
  recs().filter(r => r.subjectId === ME.id && r.type === "ghi_nhan" &&
                     r.status === "approved" && r.period === per)
        .forEach(r => {
    const c = crit(r.critId) || {};
    biet.push({ ic:"🌟", cls:"vui", tit:"Bạn được ghi nhận",
      ma:r.critCode, nhom:c.group || "", mo:(r.detail || "").slice(0, 120),
      phu:esc((user(r.reporterId) || {}).name || "") + " lập · " + fmtDate(r.createdAt),
      luc:r.createdAt });
  });

  // 3. Kháng nghị của mình đã có kết luận
  recs().filter(r => r.subjectId === ME.id && r.khieuNai &&
                     r.khieuNai.status === "resolved")
        .forEach(r => {
    const huy = r.status === "rejected";
    biet.push({ ic: huy ? "✅" : "📌", cls: huy ? "vui" : "thuong",
      tit: huy ? "Kháng nghị được chấp nhận" : "Kháng nghị đã có kết luận",
      ma:r.critCode, nhom:"", mo:r.khieuNai.note || "",
      phu:esc((user(r.khieuNai.decidedBy) || {}).name || "") + " · " + fmtDate(r.khieuNai.decidedAt),
      luc:r.khieuNai.decidedAt });
  });

  // 4. Việc của Phòng Nhân sự
  pendingRecords().forEach(r => {
    lam.push({ ic:"🌟", cls:"thuong", tit:"Phiếu ghi nhận chờ bạn duyệt",
      ma:r.critCode, nhom:(user(r.subjectId) || {}).name || "",
      mo:(r.detail || "").slice(0, 120),
      phu:esc((user(r.reporterId) || {}).name || "") + " lập · " + fmtDate(r.createdAt),
      luc:r.createdAt, nut:'<button class="btn sm" data-act="di-duyet">Mở tab Duyệt</button>' });
  });
  pendingKhieuNai().forEach(r => {
    lam.push({ ic:"⚑", cls:"gap", tit:"Kháng nghị chờ bạn xử lý",
      ma:r.critCode, nhom:(user(r.subjectId) || {}).name || "",
      mo:(r.khieuNai.text || "").slice(0, 120),
      phu:"Gửi " + fmtDate(r.khieuNai.at),
      luc:r.khieuNai.at, nut:'<button class="btn sm" data-act="di-duyet">Mở tab Duyệt</button>' });
  });

  const moiTruoc = (a, b) => String(b.luc || "").localeCompare(String(a.luc || ""));
  return { lam: lam.sort(moiTruoc), biet: biet.sort(moiTruoc).slice(0, 12) };
}

function openThongBao(){
  const { lam, biet } = thongBao();
  const the = t =>

        '<span class="grow"><b>' + esc(t.tit) + "</b>" +

        "</span></div>" +

      '<div class="phu">' + t.phu + "</div>" +
      (t.nut ? '<div class="row" style="margin-top:8px">' + t.nut + "</div>" : "") +
    "</div>";

}

/** Thang điểm thật của một khung: khởi ở đâu, trần ở đâu, và vì sao.
    Cần cái này vì khung nào nhiều câu đo ghi nhận thì khởi điểm thấp hẳn,
    dễ bị đọc nhầm thành "đang kém". */
function openTranNgach(kk, uid){
  // Tính lại từ chính người đó, không dựa vào thẻ vẽ gần nhất — mở hồ sơ
  // người khác rồi quay về sẽ không lấy nhầm số của người vừa xem.
  const st = uid ? statsOf(uid, VIEW.period) : VIEW.tranSt;
  if (!st) return;
  const k = (st.perKhung || []).find(x => x.k === kk);
  if (!k) return;
  const cfg = st.cfg || scoreCfg();

  const khoi  = k.khoiTb === null || k.khoiTb === undefined ? 0 : k.khoiTb;
  const tran  = cfg.cap;
  const day   = cfg.floor;
  const hien  = k.tb === null ? khoi : k.tb;
  const pct   = v => tran > day ? Math.max(0, Math.min(100, (v - day) / (tran - day) * 100)) : 0;
  // Một phiếu ghi nhận đẩy MỘT câu lên bonus điểm, rồi chia đều cho số câu của khung.
  const moiPhieu = k.soApDung ? (cfg.bonus || 1) / k.soApDung : 0;
  const conBu    = moiPhieu ? Math.ceil((tran - hien) / moiPhieu) : 0;

  openModal(k.ma + " · " + k.ten,
    '<div class="thang">' +
      '<div class="vach">' +
        '<div class="di" style="left:' + pct(khoi) + '%"></div>' +
        '<div class="cham" style="left:' + pct(hien) + '%"><b>' + hien.toFixed(2) + "</b></div>" +
      "</div>" +
      '<div class="moc"><span>' + day.toFixed(2) + "</span>" +
        "<span>thấp nhất — cao nhất</span>" +
        "<span>" + tran.toFixed(2) + "</span></div>" +
    "</div>" +

    '<div class="ct-buoc" style="margin-top:16px"><span class="n">□</span><div>' +
      "<b>Trung bình " + k.soApDung + " câu, mỗi câu thang " + day + "–" + tran + "</b>" +
      '<p class="tiny muted">Khớp đúng công thức của Phiếu đánh giá tháng: cộng điểm các câu ' +
        "thuộc phạm vi rồi chia cho số câu. Câu ngoài phạm vi rời khỏi cả tử số lẫn mẫu số.</p>" +
    "</div></div>" +

    '<div class="ct-buoc"><span class="n">↧</span><div>' +
      "<b>Khởi điểm đầu tháng: " + khoi.toFixed(2) + "</b>" +
      '<p class="tiny muted">Không phải 0, cũng không phải ' + tran.toFixed(2) + ". Khung này có " +
        k.soApDung + " câu:</p>" +
      '<div class="ct-vai"><span class="v">' + k.soDoLoi + " câu đo lỗi</span><span>khởi " +
        cfg.khoiViPham + " → góp " + (k.soDoLoi * cfg.khoiViPham) + " điểm</span></div>" +
      '<div class="ct-vai"><span class="v">' + k.soDoGhiNhan + " câu đo ghi nhận</span><span>khởi " +
        cfg.khoiGhiNhan + " → góp " + (k.soDoGhiNhan * cfg.khoiGhiNhan) + " điểm</span></div>" +
      '<div class="ct-vai"><span class="v">Chia đều</span><span>' +
        (k.soDoLoi * cfg.khoiViPham + k.soDoGhiNhan * cfg.khoiGhiNhan) + " ÷ " +
        k.soApDung + " = <b>" + khoi.toFixed(2) + "</b></span></div>" +
    "</div></div>" +

    '<div class="ct-buoc"><span class="n">=</span><div>' +
      "<b>Đang ở: " + hien.toFixed(2) +
        (k.tyLe === null ? "" : " — đạt " + k.tyLe.toFixed(1) + "%") + "</b>" +
      (k.ghiNhan
        ? '<div class="ct-vai"><span class="v">' + k.ghiNhan + " phiếu ghi nhận</span>" +
          '<span style="color:var(--ok)">+' + (k.ghiNhan * cfg.bonus).toFixed(0) +
          " điểm thô</span></div>" : "") +
      (k.viPham
        ? '<div class="ct-vai"><span class="v">' + k.viPham + " biên bản vi phạm</span>" +
          '<span style="color:var(--bad)">−' + (k.viPham * cfg.penalty).toFixed(0) +
          " điểm thô</span></div>" : "") +
      (!k.ghiNhan && !k.viPham
        ? '<div class="ct-vai"><span class="v">Chưa có sự việc nào</span><span>chưa đổi</span></div>' : "") +
      '<div class="ct-vai"><span class="v">Tổng điểm thô</span><span>' + k.dat.toFixed(0) +
        " ÷ " + k.soApDung + " = <b>" + hien.toFixed(2) + "</b></span></div>" +
      '<p class="tiny muted">Vì chia cho ' + k.soApDung + " câu nên một sự việc chỉ dịch được " +
        moiPhieu.toFixed(3) + " điểm của khung. Muốn thấy rõ thì phải nhiều việc, " +
        "hoặc để hội đồng chấm tay trên phiếu.</p>" +
    "</div></div>" +

    '<div class="ct-buoc"><span class="n">↑</span><div>' +
      "<b>Cao nhất: " + tran.toFixed(2) + "</b>" +
      '<p class="tiny muted">' +
        (hien >= tran
          ? "Khung này đang ở trần."
          : (k.soDoGhiNhan
              ? "Muốn chạm trần thì " + k.soDoGhiNhan + " câu đo ghi nhận phải được đẩy lên " +
                tran + ", tức cần khoảng <b>" + Math.max(0, conBu) + " phiếu ghi nhận</b> nữa " +
                "trong khung này, và không có biên bản nào."
              : "Khung này toàn câu đo lỗi nên chỉ cần không có biên bản nào là đã ở trần.")) +
      "</p>" +
    "</div></div>" +

    '<div class="ct-buoc"><span class="n">↓</span><div>' +
      "<b>Thấp nhất: " + day.toFixed(2) + "</b>" +
      '<p class="tiny muted">Mỗi biên bản trừ ' + cfg.penalty + " điểm của chính câu bị lập. " +
        "Câu xuống tới " + day + " thì dừng, không âm.</p>" +
    "</div></div>" +

    '<p class="tiny muted" style="margin:12px 0 0;padding-top:11px;border-top:1px solid var(--line)">' +
      "Sang tháng mới khung này quay lại " + khoi.toFixed(2) + ". " +
      "Biên bản và ghi nhận tháng trước không mang sang.</p>");
}

/* Dòng nhắc dưới mỗi thẻ ngạch: nói thẳng còn kiếm được bao nhiêu và mỗi phiếu đáng bao nhiêu %.
   Đây là chỗ duy nhất trên hồ sơ nói cho người ta biết cách tự nâng điểm của mình. */
function nhacCaiThien(k, cfg){
  cfg = cfg || scoreCfg();
  if (k.dat === null || !k.toiDa || !k.soApDung) return '<div class="ng-phu"></div>';
  const thieu = k.toiDa - k.dat;                       // còn thiếu bao nhiêu điểm thô
  // Một phiếu ghi nhận đẩy MỘT câu lên bonus điểm, chia cho số câu của khung.
  const moiCai = (cfg.bonus || 1) / k.soApDung / (cfg.cap || 5) * 100;
  const soPhieu = Math.ceil(thieu / (cfg.bonus || 1));
  if (thieu <= 0) return '<div class="ng-phu du">✓ Đã đủ điểm khung này</div>';
  return '<div class="ng-phu">' +
    '<b>+' + moiCai.toFixed(2) + "%</b> mỗi phiếu ghi nhận · còn <b>" + soPhieu +
    "</b> phiếu nữa là đủ</div>";
}

function bangNgach(st){
  VIEW.tranSt = st;
  const cfg = st.cfg || scoreCfg();
  // Khởi điểm của khung = trung bình điểm sẵn có, tính trên chính các câu của khung.
  const khoiCua = k => k.khoiTb === null || k.khoiTb === undefined ? 0 : k.khoiTb;
  const tlKhoi  = k => cfg.cap ? khoiCua(k) / cfg.cap * 100 : 0;
  const pc = v => Math.max(0, Math.min(100, v));
  const mau = v => v === null ? "var(--ink-3)" : v > 0 ? "var(--ok)" : v < 0 ? "var(--bad)" : "var(--ink-2)";
  const the = k => {
    const co = k.ghiNhan || k.viPham;
    // Màu theo mức điểm trên thang 0–5, không theo dấu cộng trừ nữa.
    const cls = k.tyLe === null ? " lang" : k.tyLe >= 85 ? " tot" : k.tyLe < 55 ? " xau" : "";
    return '<div class="ng-the' + cls + '">' +
      '<div class="ng-ma">' + esc(k.ma) +
        '<button class="ng-hoi" data-tran-ngach="' + k.k + '" data-tn-ai="' +
          esc(st.cuaAi || "") + '" title="Thang điểm khung này">!</button>' +
        (k.ts ? '<span class="ts">' + k.ts + "%</span>" : "") + "</div>" +
      '<div class="ng-ten">' + esc(k.ten) + "</div>" +
      '<div class="ng-so">' + (k.tyLe === null ? "—" :
          k.tyLe.toFixed(1) + '<span class="ng-pt">%</span>') + "</div>" +
      '<div class="ng-tl">' + (k.tb === null ? "" : k.tb.toFixed(2) + " / " + cfg.cap.toFixed(0) +
          " điểm") + "</div>" +
      '<div class="ng-tinh">' +
        (co
          ? (k.ghiNhan ? '<span class="ok">+' + k.ghiNhan + " ghi nhận</span>" : "") +
            (k.ghiNhan && k.viPham ? '<span class="nga"> · </span>' : "") +
            (k.viPham ? '<span class="bad">−' + k.viPham + " biên bản</span>" : "")
          : '<span class="nga">chưa có sự việc</span>') +
      "</div>" +
      '<div class="ng-thang">' +
        '<span class="mo">' + cfg.floor.toFixed(0) + "</span>" +
        '<span class="vach"><i style="left:' + pc(tlKhoi(k)) + '%"></i>' +
          '<b style="left:' + pc(k.tyLe === null ? tlKhoi(k) : k.tyLe) + '%"></b></span>' +
        '<span class="mo">' + cfg.cap.toFixed(0) + "</span>" +
      "</div>" +
      nhacCaiThien(k, cfg) +
    "</div>";
  };
  const o = (n, nhan, cls) =>
    '<div class="sv-o ' + (cls || "") + '"><b>' + n + "</b><span>" + nhan + "</span></div>";
  return '<div class="ng-bang">' +
      '<div class="ng-hang n' + st.perKhung.length + '">' +
        st.perKhung.map(the).join("") + "</div>" +
      '<div class="sv-hang">' +
        o(st.events.length, "sự việc trong kỳ") +
        o(st.nGhiNhan, "phiếu ghi nhận", "ok") +
        o(st.nViPham, "biên bản vi phạm", "bad") +
      "</div>" +
      duongLenHTML(st, cfg) +
    "</div>";
}

/* Dải nhắc dưới bộ thẻ: cách duy nhất để tự nâng tỷ lệ là được ghi nhận.
   Nói bằng con số của chính người đang xem, không nói chung chung. */
function duongLenHTML(st, cfg){
  cfg = cfg || scoreCfg();
  const co = (st.perKhung || []).filter(k => k.dat !== null && k.toiDa);
  if (!co.length) return "";
  const thieu = co.reduce((a, k) => a + Math.ceil((k.toiDa - k.dat) / (cfg.bonus || 1)), 0);
  if (thieu <= 0){
    return '<div class="duong-len du">🎉 <b>Đang ở 100%.</b> ' +
      "Mọi khung đều đủ điểm — giữ nguyên như vậy là tốt nhất.</div>";
  }
  // Phiếu ghi nhận ở khung nào đáng nhất: %/phiếu nhân trọng số của khung đó.
  const xep = co.filter(k => k.toiDa > k.dat).map(k => ({
    ma: k.ma, ten: k.ten,
    thieu: Math.ceil((k.toiDa - k.dat) / (cfg.bonus || 1)),
    loi: (cfg.bonus || 1) / k.soApDung / (cfg.cap || 5) * 100 * ((k.tsThuc || 0) / 100)
  })).sort((a, b) => b.loi - a.loi);
  const nhat = xep[0];
  return '<div class="duong-len">' +
    '<span class="ic">💡</span>' +
    "<div><b>Muốn lên điểm thì phải được ghi nhận.</b> " +
      "Đây là cách duy nhất tỷ lệ đi lên — biên bản chỉ kéo xuống, và không có sự việc nào " +
      "thì điểm đứng yên tại chỗ." +
      '<div class="tiny" style="margin-top:6px">Còn <b>' + thieu + " phiếu ghi nhận</b> " +
        "có thể kiếm trong tháng này." +
        (nhat ? " Đáng nhất là ở <b>" + esc(nhat.ma) + " " + esc(nhat.ten) + "</b> — " +
          "mỗi phiếu ở đó cộng <b>+" + nhat.loi.toFixed(2) + "%</b> vào tỷ lệ chung." : "") +
      "</div>" +
    "</div></div>";
}

        (st.hasData

    "</div>") +
    (anDanhGia() ? bangNgach(st) : '<div class="bacot">' +

      // Cột 1 — điểm theo cấp của người đánh giá
      '<div class="cot">' +
        '<div class="cot-tit">Ai đánh giá</div>' +

              '<div class="so">' + l.tb.toFixed(2) + "</div>" +

          : '<div class="phu">Chưa ai đánh giá.</div>') +
        (st.tbDanhGia !== null
          ? '<div class="tong"><span>Trung bình đánh giá</span><b>' + st.tbDanhGia.toFixed(2) + "</b></div>" +
            (st.perLevel.length > 1

          : "Chưa có đánh giá hay sự việc nào. Đây là điểm nền mặc định: câu đo lỗi coi như đạt chuẩn, câu đo năng lực ở mức giữa.") +

/** Chi tiết theo khung khi phần đánh giá đang ẩn.
    Không có điểm nào cả — mỗi khung chỉ đếm ghi nhận và biên bản,
    rồi liệt kê từng sự việc kèm mã câu để tra ngược. */
function khungSuViec(st){
  const kh = (st.perKhung || []).filter(x => x.soApDung > 0);
  if (!kh.length) return "";
  const cfg = st.cfg || scoreCfg();
  return '<div class="sec-title">Sự việc theo khung</div>' +
    kh.map(k => {
      const co = k.ghiNhan || k.viPham;
      const sv = (st.events || [])
        .filter(e => khungCua(crit(e.critId)) === k.k)
        .sort((a, b) => String(b.xayRaLuc || b.createdAt).localeCompare(String(a.xayRaLuc || a.createdAt)));
      // Thanh tóm tắt: mã, tên, phép tính ngắn, điểm. Bấm mới xổ danh sách ra.
      const thanh =
        '<span class="grow"><b>' + esc(k.ma) + "</b> " + esc(k.ten) +
        '<span class="tiny muted" style="display:block">' +
          "trung bình " + k.soApDung + " câu" +
          (co
            ? " · " + sv.length + " sự việc" +
              (k.ghiNhan ? ' <span style="color:var(--ok)">+' + k.ghiNhan + "</span>" : "") +
              (k.viPham ? ' <span style="color:var(--bad)">−' + k.viPham + "</span>" : "")
            : " · chưa có sự việc nào") +
          (k.ts ? " · trọng số " + k.ts + "%" : "") +
        "</span></span>" +
        '<span class="val">' + (k.tb !== null ? k.tb.toFixed(2) : "—") + "</span>";

      // Khung rỗng thì không có gì để xổ, để nguyên thanh cho khỏi bấm hụt.
      if (!sv.length) return '<div class="lichsu khung-thanh trong">' + thanh + "</div>";

      return '<details class="lichsu khung-thanh"><summary>' + thanh + "</summary>" +
        '<div class="card" style="margin-top:8px">' + sv.map(e => {
          const c = crit(e.critId) || {};
          const vp = e.type === "vi_pham";
          return '<div class="pad" style="border-bottom:1px solid var(--line)">' +
            '<div class="tiny" style="font-weight:700;color:' +
              (vp ? "var(--bad)" : "var(--ok)") + '">' +
              (REC_KIND[e.type] || {}).icon + " " + (vp ? "−" + cfg.penalty : "+" + cfg.bonus) +
              " · " + esc(e.critCode || "") + (c.group ? " · " + esc(c.group) : "") +
              (st.diemCau && st.diemCau[e.critId]
                ? ' <span style="float:right;color:var(--ink-2)">câu này còn ' +
                  st.diemCau[e.critId].diem + "/" + cfg.cap + "</span>" : "") +
              "</div>" +
            '<div class="tiny" style="margin-top:3px">' + esc(e.detail || "") + "</div>" +
            '<div class="tiny muted" style="margin-top:3px">🕐 ' +
              esc(fmtGio(e.xayRaLuc || e.createdAt)) + " · " +
              esc((user(e.reporterId) || {}).name || "?") + " lập</div>" +
          "</div>";
        }).join("") + "</div></details>";
    }).join("");
}

function critBreakdown(st){
  if (anDanhGia()) return khungSuViec(st);
  if (!st.perGroup || !st.perGroup.length) return "";
  // dùng chung khungCua() ở trên, không định nghĩa lại luật ở đây
  let lastSection = null;
  return '<div class="sec-title">Chi tiết điểm theo khung</div>' +
    st.perGroup.map(g => {
      const kk = khungCua(g);   // g mang trackId và ngach nên dùng thẳng được
      const kh = (st.perKhung || []).find(x => x.k === kk);
      let head = "";
      if (kk !== lastSection){
        lastSection = kk;
        head = '<div class="khung-head">' +
          "<span><b>" + (kh ? kh.ma : "") + "</b> " + esc(kh ? kh.ten : "") + "</span>" +
          '<span class="val">' + (kh && kh.tb !== null ? kh.tb.toFixed(2) : "—") + "</span>" +
          "</div>" +
          (kh ? '<div class="tiny muted" style="margin:-2px 0 8px">' + kh.soDaCham + "/" + kh.soApDung +
            " câu được chấm" +
            (kh.ghiNhan || kh.viPham ? " · " + kh.ghiNhan + " ghi nhận, " + kh.viPham + " biên bản" : "") +
            "</div>" : "");
      }
      return head +
        '<details class="card" style="margin-bottom:6px">' +
          '<summary class="grp-sum"><span class="grow">' +
            "<b>" + esc(g.gcode) + "</b> · " + esc(g.name) +
            '<div class="bar" style="margin-top:6px"><i style="width:' + (g.avg/5*100) + '%"></i></div>' +
          "</span>" +
          '<span class="val" style="font-weight:700;font-variant-numeric:tabular-nums">' + g.avg.toFixed(2) + "</span>" +
          "</summary>" +
          '<div class="pad">' + g.items.slice().sort((a,b)=>a.avg-b.avg).map(p => {
            const evs = p.events || [];
            return '<div class="crit-row"><div class="lab"><span style="flex:1">' +
              esc(p.crit.code) + ". " + esc(p.crit.name) +
              (evs.length ? evs.map(e => ' <span class="pill ' + (e.type === "vi_pham" ? "bad" : "ok") +
                '">' + (REC_KIND[e.type]||{}).icon + "</span>").join("") : "") +
              "</span>" +
              '<span class="val">' + p.avg.toFixed(2) + "</span></div>" +
              '<div class="bar"><i style="width:' + (p.avg/5*100) + '%"></i></div>' +
              (evs.length ? evs.map(e =>
                '<div class="tiny muted" style="margin-top:5px;padding-left:10px;border-left:2px solid var(--line)">' +
                (REC_KIND[e.type]||{}).icon + " " + esc(e.detail.slice(0, 110)) +
                " — " + esc((user(e.reporterId)||{}).name || "") + "</div>").join("") : "") +
            "</div>";
          }).join("") +
          "</div>" +
        "</details>";
    }).join("");
}
function luuYCard(st){
  // Bảng này xếp theo điểm chấm. Đánh giá đang ẩn thì không có điểm để xếp.
  if (anDanhGia()) return "";
  const arr = st.weaknesses || [];
  if (!st.hasData || !arr.length) return "";

  return '<div class="sec-title">Những điểm cần lưu ý · cải thiện</div>' +
    '<div class="card pad">' +
      '<div class="tiny muted" style="margin-bottom:10px">' +
        "Điểm thấp nhất trong số câu đã được chấm. Nên tập trung vào đây trước.</div>" +
      '<div class="luuy-ds">' +
      arr.map(p =>
        '<div class="mucnb">' +
          '<div class="hd"><span class="ma">' + esc(p.crit.code) + "</span>" +
            '<b class="d">' + p.avg.toFixed(1) + "</b></div>" +
          '<div class="tx">' + esc(p.crit.name) + "</div>" +
        "</div>").join("") +
      "</div>" +
    "</div>";
}

/** Danh sách sự việc trong kỳ, đọc được nội dung.
    Người được nêu luôn xem được phần của mình; quản lý xem được phần người mình phụ trách. */
function eventList(u, st){
  if (!u) return "";
  // Chỉ chính người được nêu, quản lý phụ trách người đó, và admin mới đọc được.
  // Đồng nghiệp cùng chỗ làm KHÔNG đọc được biên bản của nhau.
  const duocXem = u.id === ME.id || isAdmin(ME) || (isManager(ME) && inScope(ME, u));
  if (!duocXem || !st.events.length) return "";
  const sap = st.events.slice().sort((a,b) => b.createdAt.localeCompare(a.createdAt));
  const gn = sap.filter(e => e.type === "ghi_nhan").length;
  const vp = sap.length - gn;
  return '<details class="lichsu"><summary>' +
      '<span class="grow"><b>Lịch sử ghi nhận &amp; vi phạm</b>' +
      '<span class="tiny muted" style="display:block">' +
        (gn ? gn + " ghi nhận" : "") + (gn && vp ? " · " : "") + (vp ? vp + " biên bản" : "") +
        " · kỳ " + esc(periodLabel(st.period)) + "</span></span>" +
      '<span class="dem">' + sap.length + "</span>" +
    "</summary>" +
    '<div class="card" style="margin-top:8px">' + sap.map(e => {
      const k = REC_KIND[e.type] || {};
      const c = e.isBoundary ? null : crit(e.critId);
      // Mọi ngạch đều tính điểm, chỉ ranh giới là chặn thẳng chứ không cộng trừ.
      const tinhDiem = !e.isBoundary && !!c;
      const rep = user(e.reporterId);
      return '<div style="padding:13px;border-bottom:1px solid var(--line)">' +
        '<div class="row" style="align-items:flex-start">' +
          '<span style="font-size:17px;flex:none">' + k.icon + "</span>" +
          '<div style="flex:1;min-width:0">' +
            '<div class="tiny" style="font-weight:700">' + esc(e.critCode || "") +
              (c ? " · " + esc(c.group) : "") + "</div>" +
            (c ? '<div class="tiny muted">' + esc(c.name) + "</div>" : "") +
          "</div>" +
          '<span class="pill ' + (e.isBoundary ? "bad" : tinhDiem ? k.cls : "") + '">' +
            (e.isBoundary ? "⛔ chặn kết quả" : tinhDiem ? (e.type === "vi_pham" ? "−1" : "+1") : "không tính điểm") +
          "</span>" +
        "</div>" +
        '<p style="margin:9px 0 0;font-size:13.5px">' + esc(e.detail || "") + "</p>" +
        anhHTML(e) +
        '<div class="tiny muted" style="margin-top:6px">' +
          (e.xayRaLuc ? "Xảy ra " + esc(fmtGio(e.xayRaLuc)) + " · " : "") +
          esc(rep ? rep.name : "?") + " lập · " + fmtDate(e.createdAt) + "</div>" +
        (e.reply ? '<p class="tiny" style="margin:8px 0 0;padding:8px;border-left:3px solid var(--line)">' +
          "<b>Phản hồi:</b> " + esc(e.reply) + "</p>" : "") +
