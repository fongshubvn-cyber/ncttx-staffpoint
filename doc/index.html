/* ---- Mục cần phát huy và cải thiện ----
   Gom sự việc theo từng câu, rồi xếp mức: câu nào được ghi nhận nhiều lần thì
   đáng phát huy, câu nào lặp lại biên bản thì càng lặp càng đáng lo. */
const MUC_LUUY = [
  { k:"toa",   n:3, icon:"🏆", ten:"Đang toả sáng",        mo:"lần được ghi nhận",  cls:"toa"   },
  { k:"sang",  n:2, icon:"🌟", ten:"Điểm mạnh",            mo:"lần được ghi nhận",  cls:"sang"  },
  { k:"nhen",  n:1, icon:"✨", ten:"Điểm sáng mới",        mo:"lần được ghi nhận",  cls:"nhen"  },
  { k:"trung", n:0, icon:"⚖️", ten:"Lúc được lúc chưa",    mo:"",                   cls:"trung" },
  { k:"nhac",  n:1, icon:"💡", ten:"Nên để ý",             mo:"lần bị nhắc",        cls:"nhac"  },
  { k:"lap",   n:2, icon:"⚠️", ten:"Lặp lại, cần cải thiện", mo:"lần bị nhắc",      cls:"lap"   },
  { k:"nang",  n:3, icon:"🔴", ten:"Nghiêm trọng, lặp nhiều lần", mo:"lần bị nhắc", cls:"nang"  }
];

function mucLuuY(st){
  const theoCau = {};
  (st.events || []).forEach(e => {
    if (e.isBoundary) return;
    const c = crit(e.critId); if (!c) return;
    const o = theoCau[c.id] || (theoCau[c.id] = { crit:c, gn:0, vp:0, sv:[] });
    if (e.type === "ghi_nhan") o.gn++; else o.vp++;
    o.sv.push(e);
  });
  return Object.keys(theoCau).map(id => {
    const o = theoCau[id];
    let m;
    if (o.gn && o.vp)      m = MUC_LUUY[3];
    else if (o.gn)         m = o.gn >= 3 ? MUC_LUUY[0] : o.gn === 2 ? MUC_LUUY[1] : MUC_LUUY[2];
    else                   m = o.vp >= 3 ? MUC_LUUY[6] : o.vp === 2 ? MUC_LUUY[5] : MUC_LUUY[4];
    return Object.assign({}, o, { muc:m, diem: o.gn - o.vp, nang: o.gn ? 0 : o.vp });
  }).sort((a, b) => b.nang - a.nang || b.gn - a.gn);
}

function luuYSuVieccard(st){
  const ds = mucLuuY(st);
  if (!ds.length) return "";
  // Bên trái: chỗ được ghi nhận. Bên phải: chỗ bị nhắc, kể cả chỗ lúc được lúc chưa.
  const trai = ds.filter(x => x.gn && !x.vp);
  const phai = ds.filter(x => x.vp);

  const the = x =>
    '<div class="luuy-the ' + x.muc.cls + '">' +
      '<div class="dau"><span class="ic">' + x.muc.icon + "</span>" +
        '<span class="grow"><b>' + esc(x.crit.code) + "</b> " +
          '<span class="nhan">' + esc(x.muc.ten) + "</span></span>" +
        '<span class="dem">' + (x.gn && x.vp ? "+" + x.gn + " / −" + x.vp
          : (x.gn ? "×" + x.gn : "×" + x.vp)) + "</span>" +
      "</div>" +
      '<div class="tx">' + esc(x.crit.name) + "</div>" +
      (x.crit.group ? '<div class="nhom">' + esc(x.crit.group) + "</div>" : "") +
    "</div>";

  const cot = (cls, tit, phu, arr, trong) =>
    '<div class="luuy-cot ' + cls + '">' +
      '<div class="cot-dau"><span class="tit">' + tit + "</span>" +
        '<span class="soluong">' + arr.length + "</span></div>" +
      '<div class="phu">' + phu + "</div>" +
      (arr.length ? arr.map(the).join("") : '<div class="rong">' + trong + "</div>") +
    "</div>";

  return '<div class="sec-title">Mục cần phát huy và cải thiện</div>' +
    '<div class="luuy-doi">' +
      cot("ben-tot", "🌱 Nên phát huy",
          "Chỗ đã có người ghi nhận. Giữ nguyên cách đang làm.",
          trai, "Kỳ này chưa có ghi nhận nào.") +
      cot("ben-xau", "🔧 Nên cải thiện",
          "Xếp theo số lần bị nhắc. Càng lặp lại càng nên xử lý sớm.",
          phai, "Kỳ này chưa có biên bản nào. 🎉") +
    "</div>";
}

/** Ngày giờ hết hạn, viết gọn kèm tên thứ. */
function fmtHan(d){
  if (!d) return "";
  return TEN_THU[d.getDay()] + " " +
    String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") +
    "/" + d.getFullYear();
}

/** Ảnh và video người gửi đơn kháng nghị đính kèm. */
function tepKNHTML(r){
  const ds = (r.khieuNai && r.khieuNai.tep) || [];
  if (!ds.length) return "";
  return '<div class="anh-xem" style="margin-top:8px">' + ds.map(function (a, i){
    return a.kieu === "video"
      ? '<div class="anh-o"><video src="' + a.data + '" style="width:100%;height:100%;object-fit:cover" ' +
        'controls playsinline preload="metadata"></video>' +
        '<span class="dl" style="left:4px;right:auto">🎬</span></div>'
      : '<div class="anh-o"><img src="' + a.data + '" alt="' + esc(a.ten || "ảnh") +
        '" data-xem-kn="' + r.id + ":" + i + '"></div>';
  }).join("") + "</div>";
}

/**
 * Nguồn của một ảnh.
 * Ảnh cũ nằm ngay trong kho (a.data). Ảnh mới đẩy lên Drive, kho chỉ giữ a.url.
 * Đọc cả hai để bản cũ và bản mới cùng xem được, không phải đi chuyển dữ liệu.
 */
function nguonAnh(a){
  if (!a) return "";
  if (a.data) return a.data;
  if (!a.url) return "";
  // Đường dẫn Drive dạng /file/d/<id>/view không nhúng thẳng vào <img> được.
  const m = String(a.url).match(/[-\w]{25,}/);
  return m ? "https://drive.google.com/thumbnail?id=" + m[0] + "&sz=w1280" : a.url;
}

/** Ảnh kèm bản ghi, bấm vào để xem lớn. */
function anhHTML(r){
  const as = r.anh || [];
  if (!as.length) return "";
  return '<div class="anh-xem" style="margin-top:10px">' + as.map((a, i) =>
    '<div class="anh-o"><img src="' + nguonAnh(a) + '" alt="' + esc(a.ten || "ảnh") +
    '" data-xem-anh="' + r.id + ":" + i + '"></div>').join("") + "</div>";
}
function openAnh(key, tuKhieuNai){
  const parts = String(key).split(":");
  const id = parts[0], i = Number(parts[1]);
  const r = (DB.records || []).find(x => x.id === id);
  if (!r) return;
  const kho = tuKhieuNai ? ((r.khieuNai && r.khieuNai.tep) || []) : (r.anh || []);
  const a = kho[i];
  if (!a) return;
  openModal(a.ten || (tuKhieuNai ? "Tệp kèm đơn kháng nghị" : "Ảnh kèm bản ghi"),
    a.kieu === "video"
      ? '<video src="' + nguonAnh(a) + '" controls playsinline style="width:100%;border-radius:10px;display:block"></video>'
      : '<img src="' + a.data + '" alt="" style="width:100%;border-radius:10px;display:block">');
}

function manageScore(){
  const c = scoreCfg();
  // Ví dụ trên một khung 90 câu: 70 câu đo lỗi (khởi 5) + 20 câu đo ghi nhận (khởi 0).
  const VD_LOI = 70, VD_GN = 20, VD_CAU = VD_LOI + VD_GN;
  const vdKhoi = (VD_LOI * c.khoiViPham + VD_GN * c.khoiGhiNhan) / VD_CAU;
  const vd = (bb, gn) => {
    const mat  = Math.min(VD_LOI * (c.cap - c.floor), bb * c.penalty);
    const them = Math.min(VD_GN  * (c.cap - c.khoiGhiNhan), gn * c.bonus);
    const d = Math.max(c.floor, Math.min(c.cap, vdKhoi + (them - mat) / VD_CAU));
    return d.toFixed(2) + ' <span class="tiny muted">· đạt ' +
           (c.cap ? (d / c.cap * 100).toFixed(1) : "0") + "%</span>";
  };
  const o2 = (id, nhan, val) =>
    '<label class="ts-o"><span>' + nhan + "</span>" +
    '<input class="input" id="' + id + '" type="number" step="1" value="' + val + '"></label>';
  const o = (id, nhan, val, giai) =>
    '<label class="field"><span>' + nhan + '</span><input class="input" id="' + id +
    '" type="number" step="0.05" value="' + val + '">' +
    '<span class="tiny muted" style="display:block;margin-top:4px">' + giai + "</span></label>";
  return '<div class="card pad" style="margin-bottom:14px;background:var(--surface-2);box-shadow:none">' +
      '<div class="tiny muted" style="font-weight:700;margin-bottom:6px">Cách ra điểm kỳ</div>' +
      '<p class="tiny" style="margin:0;line-height:1.6">' +
        "<b>1.</b> Mỗi câu chấm theo thang 0–5. Câu đo vi phạm khởi ở 5, câu đo ghi nhận khởi ở 0.<br>" +
        "<b>2.</b> Mỗi biên bản trừ và mỗi phiếu ghi nhận cộng vào điểm của CHÍNH CÂU đó, kẹp trong sàn và trần.<br>" +
        "<b>3.</b> Điểm một khung = TRUNG BÌNH các câu thuộc phạm vi — khớp SUMIF/COUNTIF của phiếu.<br>" +
        "<b>4.</b> Ghép ba khung theo trọng số bên dưới ra điểm tổng thang 0–5, rồi tra ngưỡng ra Bậc." +
      "</p></div>" +
    '<div class="card pad">' +
      o("sc-kvp", "Khởi điểm câu ĐO LỖI", c.khoiViPham,
        "Đầu kỳ chưa có biên bản nào thì câu ở nhóm đo vi phạm đứng ở đây.") +
      o("sc-kgn", "Khởi điểm câu ĐO GHI NHẬN", c.khoiGhiNhan,
        "Đầu kỳ chưa có phiếu ghi nhận nào thì câu ở nhóm đo ghi nhận đứng ở đây.") +
      o("sc-pen", "Mỗi biên bản vi phạm trừ", c.penalty,
        "Trừ vào điểm của CHÍNH CÂU bị lập biên bản.") +
      o("sc-bon", "Mỗi phiếu ghi nhận cộng", c.bonus,
        "Cộng vào điểm của CHÍNH CÂU được ghi nhận.") +
      o("sc-floor", "Sàn điểm một câu", c.floor, "Điểm thấp nhất một câu có thể xuống.") +
      o("sc-cap", "Trần điểm một câu", c.cap, "Điểm cao nhất một câu có thể lên.") +

          o2("ts-ql-ql", "B.3", c.tsQL.ql) + "</div>" +

          o2("ts-kc", "B.1", c.ts.kc) + o2("ts-cm", "B.2", c.ts.cm) + "</div>" +

  const num = (id, mac) => { const v = Number(($("#" + id) || {}).value); return isFinite(v) ? v : mac; };
  const cfg = {
    khoiViPham:  num("sc-kvp", SCORE_MAC_DINH.khoiViPham),
    khoiGhiNhan: num("sc-kgn", SCORE_MAC_DINH.khoiGhiNhan),
    penalty: num("sc-pen",   SCORE_MAC_DINH.penalty),
    bonus:   num("sc-bon",   SCORE_MAC_DINH.bonus),
    floor:   num("sc-floor", SCORE_MAC_DINH.floor),
    cap:     num("sc-cap",   SCORE_MAC_DINH.cap),
    tsQL: { kc: num("ts-ql-kc", 50), cm: num("ts-ql-cm", 20), ql: num("ts-ql-ql", 30) },
    ts:   { kc: num("ts-kc", 65),    cm: num("ts-cm", 35) },
    nguongBac: [1,2,3,4,5].map(b => num("ng-bac-" + b, SCORE_MAC_DINH.nguongBac[b - 1]))
  };
  if (cfg.floor >= cfg.cap){ toast("Sàn phải nhỏ hơn trần."); return; }
  const trongKhoang = v => v >= cfg.floor && v <= cfg.cap;
  if (!trongKhoang(cfg.khoiViPham) || !trongKhoang(cfg.khoiGhiNhan)){
    toast("Điểm sẵn có phải nằm giữa sàn và trần."); return;
  }
  const tong1 = cfg.tsQL.kc + cfg.tsQL.cm + cfg.tsQL.ql;
  const tong2 = cfg.ts.kc + cfg.ts.cm;
  if (tong1 !== 100){ toast("Bộ trọng số có quản lý đang cộng ra " + tong1 + "%, phải là 100%."); return; }
  if (tong2 !== 100){ toast("Bộ trọng số không quản lý đang cộng ra " + tong2 + "%, phải là 100%."); return; }
  for (let i = 1; i < 5; i++){
    if (cfg.nguongBac[i] <= cfg.nguongBac[i - 1]){
      toast("Ngưỡng bậc phải tăng dần. Bậc " + (i + 1) + " đang không lớn hơn bậc " + i + "."); return;
    }
  }
  DB.settings.scoring = cfg;
  DB.settings.anDanhGia = $("#sc-andg").checked;
  DB.settings.ganChiB2  = $("#sc-b2").checked;
  DB.settings.ngayLamViec = [0,1,2,3,4,5,6].filter(d => {
    const o = $("#sc-thu-" + d);
    return o && o.checked;
  });
  if (!DB.settings.ngayLamViec.length) DB.settings.ngayLamViec = NGAY_LAM_MAC_DINH;
  await persist(); render(); toast("Đã lưu. Mọi hồ sơ tính lại theo tham số mới.");
}

/** Cập nhật số câu đã chấm — cho cả từng nhóm lẫn tổng. */
function updateRateProgress(){
  const box = $("#ratebox"); if (!box) return;
  let done = 0, total = 0;
  box.querySelectorAll("[data-grp]").forEach(g => {
    const items = g.querySelectorAll("[data-crit]");
    let n = 0;
    items.forEach(b => { if (b.querySelector(".pick button.sel:not(.na)")) n++; });
    const badge = g.querySelector(".grp-count");
    if (badge){
      badge.textContent = n + "/" + items.length;
      badge.className = "pill grp-count" + (n === items.length ? " ok" : n ? " warn" : "");
    }
    done += n; total += items.length;
  });
  const pr = $("#rv-prog"), bar = $("#rv-bar");
  if (pr) pr.textContent = done + "/" + total;
  if (bar) bar.style.width = (total ? done * 100 / total : 0) + "%";
}

/* Ảnh kèm bản ghi. Nhận tệp tới 10MB nhưng NÉN trước khi lưu, vì bộ nhớ
   trình duyệt chỉ vài MB cho toàn bộ dữ liệu. Nén về cạnh dài tối đa 1280px,
   JPEG chất lượng 0.72 — một ảnh chụp điện thoại còn khoảng 150 tới 300KB. */
const ANH_TOI_DA_MB = 10;
const ANH_MOI_BAN_GHI = 2;
const ANH_CANH_DAI = 1280;
const ANH_CHAT_LUONG = 0.72;

function nenAnh(file){
  return new Promise((ok, loi) => {
    const fr = new FileReader();
    fr.onerror = () => loi(new Error("Không đọc được tệp"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => loi(new Error("Tệp này không phải ảnh"));
      img.onload = () => {
        try{
          let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
          const r = Math.min(1, ANH_CANH_DAI / Math.max(w, h));
          w = Math.max(1, Math.round(w * r)); h = Math.max(1, Math.round(h * r));
          const cv = document.createElement("canvas");
          cv.width = w; cv.height = h;
          cv.getContext("2d").drawImage(img, 0, 0, w, h);
          ok(cv.toDataURL("image/jpeg", ANH_CHAT_LUONG));
        }catch(e){ loi(new Error("Trình duyệt không nén được ảnh này")); }
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
/**
 * Cất ảnh.
 *
 * Không có máy chủ thì ảnh nằm ngay trong kho dưới dạng data URL — tiện nhưng
 * nặng: một tấm ảnh nén rồi vẫn cỡ 150 KB, mà cả kho mới có 159 KB. Vài chục
 * biên bản có ảnh là kho phình lên chục megabyte, mỗi lần lưu đẩy lại từ đầu.
 *
 * Có máy chủ thì đẩy ảnh lên Drive, kho chỉ giữ đường dẫn. Kho ở lại nhỏ, ảnh
 * nằm trong thư mục riêng cạnh tệp dữ liệu, và Drive lo phần phục vụ ảnh.
 */
async function catAnh(dataUrl, tenGoi){
  if (!Storage.coMayChu() || !Storage.token()) return { data: dataUrl };
  try {
    const p = String(dataUrl).indexOf(",");
    const kieu = (String(dataUrl).match(/^data:([^;]+)/) || [])[1] || "image/jpeg";
    const d = await Storage.goi("luuAnh", {
      token: Storage.token(),
      ten: (tenGoi || "anh") + "_" + Date.now() + ".jpg",
      base64: String(dataUrl).slice(p + 1),
      kieu: kieu
    }, true);
    return { url: d.url, id: d.id };
  } catch (e) {
    // Đẩy hỏng thì giữ nguyên trong kho còn hơn mất ảnh của người ta.
    toast("Không đẩy được ảnh lên Drive, tạm giữ trong máy: " + e.message);
    return { data: dataUrl };
  }
}

const coAnh = () => (RC_ANH || []).length;

/** Giờ hiện tại theo định dạng ô chọn thời gian. */
function nowLocalInput(){
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) +
         "T" + p(d.getHours()) + ":" + p(d.getMinutes());
}
const kyTu = iso => String(iso || "").slice(0, 7);
/** Đổi thời điểm ISO sang giá trị ô chọn ngày giờ, theo giờ máy người dùng. */
function isoSangInput(iso){
  const d = new Date(iso || Date.now());
  if (isNaN(d.getTime())) return nowLocalInput();
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) +
         "T" + p(d.getHours()) + ":" + p(d.getMinutes());
}

function fmtGio(iso){
  try{
    const d = new Date(iso), p = n => String(n).padStart(2, "0");
    return p(d.getHours()) + ":" + p(d.getMinutes()) + " ngày " +
           p(d.getDate()) + "/" + p(d.getMonth()+1) + "/" + d.getFullYear();
  }catch(e){ return ""; }
}

/** Bỏ dấu, bỏ hoa thường — để tìm "phan mem" cũng ra "Phát triển Phần mềm". */
function chuan(s){
  return String(s == null ? "" : s)
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/đ/g, "d").replace(/Đ/g, "D")
    .toLowerCase().trim();
}

/** Dựng các nhóm option, lọc theo chữ đang gõ. */
function optNguoi(theoNhom, chon, tim){
  const k = chuan(tim || "");
  const hop = u => !k || chuan(u.name).includes(k) || chuan(u.code).includes(k) ||
                   chuan(deptName(u.deptId)).includes(k) || chuan(levelName(u.level)).includes(k) ||
                   chuan(siteName(u.siteId)).includes(k);
  let ra = "", dem = 0;
  THU_TU_NHOM.filter(n => theoNhom[n]).forEach(n => {
    const ds = theoNhom[n].filter(hop);
    if (!ds.length) return;
    dem += ds.length;
    ra += '<optgroup label="' + esc(n) + ' (' + ds.length + ')">' +
      ds.map(u => '<option value="' + u.id + '"' + (u.id === chon ? " selected" : "") + ">" +
        esc(u.name) + " · " + esc(u.code) + " · " + esc(levelName(u.level)) +
        "</option>").join("") + "</optgroup>";
  });
  return ra || '<option value="">— không ai khớp với chữ đang gõ —</option>';
}

function openRecord(type, presetUserId){
  const k = REC_KIND[type]; if (!k) return;
  if (!canFileRecord(ME)){ toast("Bạn không lập được bản ghi này."); return; }
  RC_ANH = [];
  const people = nguoiLapDuoc(ME);
  if (!people.length){ toast("Chưa có ai để lập. Danh sách nhân sự đang trống."); return; }
  // Chia nhóm cho dễ tìm khi cả nhà nằm trong một danh sách.
  const theoNhom = {};
  people.forEach(u => {
    const n = nhomCuaNguoi(ME, u);
    if (!theoNhom[n]) theoNhom[n] = [];
    theoNhom[n].push(u);

/** Kỳ suy từ thời điểm sự việc, không nhập tay để khỏi lệch. */
function capNhatKy(){
  const o = $("#rc-luc"), n = $("#rc-ky");
  if (!o || !n) return;
  n.textContent = o.value ? "Tính vào kỳ " + periodLabel(kyTu(o.value)) : "Chọn thời điểm để biết thuộc kỳ nào.";
}

/** Chọn ảnh: kiểm dung lượng, nén, hiện ảnh xem trước. */
async function chonAnh(input){
  const err = $("#rc-err"), xem = $("#rc-xem");
  const files = [...(input.files || [])];
  input.value = "";
  for (const f of files){
    if (RC_ANH.length >= ANH_MOI_BAN_GHI){
      if (err) err.textContent = "Chỉ kèm được tối đa " + ANH_MOI_BAN_GHI + " ảnh.";
      break;
    }
    if (f.size > ANH_TOI_DA_MB * 1024 * 1024){
      if (err) err.textContent = "Ảnh " + f.name + " nặng " +
        (f.size/1048576).toFixed(1) + "MB, vượt mức " + ANH_TOI_DA_MB + "MB.";
      continue;
    }
    try{
      const data = await nenAnh(f);
      RC_ANH.push({ data, ten: f.name, goc: f.size, sau: Math.round(data.length * 0.75) });
      if (err) err.textContent = "";
    }catch(e){ if (err) err.textContent = e.message; }
  }
  if (!xem) return;
  xem.innerHTML = RC_ANH.map((a, i) =>
    '<div class="anh-o"><img src="' + a.data + '" alt="">' +
    '<button type="button" class="bo" data-bo-anh="' + i + '" title="Bỏ ảnh">✕</button>' +
    '<span class="dl">' + (a.goc/1048576).toFixed(1) + "MB → " + Math.round(a.sau/1024) + "KB</span></div>").join("");
}

/** Đổ danh sách mục theo đúng người được chọn: ranh giới cộng câu cùng kiểu chấm. */
function fillRecordCrit(type){
  const selU = $("#rc-user"), selC = $("#rc-crit"), hint = $("#rc-hint");
  if (!selU || !selC) return;
  const u = user(selU.value); if (!u) return;
  const canh = $("#rc-thu-canh");
  if (canh) canh.style.display = isDemo(u) ? "block" : "none";
  const wantMode = (REC_KIND[type] || {}).mode;
  let html = "";
  if (type === "vi_pham"){
    const bs = boundariesFor(u);
    if (bs.length) html += '<optgroup label="⛔ Ranh giới không thoả hiệp — chặn mọi kết quả">' +
      bs.map(b => '<option value="' + b.id + '">' + esc(b.scope) + " · " +
        esc(b.text.slice(0, 90)) + "</option>").join("") + "</optgroup>";
  }
  // Gắn được vào mọi câu áp dụng cho người đó. Nếu chỉ muốn giới hạn trong
  // ngạch B.2 thì bật lại ở Quản lý → Tham số.
  const chiB2 = !!(DB.settings || {}).ganChiB2;
  const b2 = criteriaFor(u).filter(c => c.mode === wantMode && (!chiB2 || c.ngach === "chuyen_mon"));
  groupCriteria(b2).forEach(g => {
    html += '<optgroup label="' + esc(g.gcode + " · " + g.name) + '">' +
      g.items.map(c => '<option value="' + c.id + '">' + esc(c.code) + " · " +
        esc(c.name.slice(0, 95)) + "</option>").join("") + "</optgroup>";
  });
  selC.innerHTML = html || '<option value="">Người này chưa có mục nào phù hợp</option>';
  if (hint){
    const co = b2.length;
    hint.innerHTML = co
      ? "Gắn vào một câu áp dụng cho " + esc(u.name) + ". Đang hiện " + co +
        (type === "vi_pham" ? " câu đo lỗi và các ranh giới." : " câu đo năng lực.")
      : '<b style="color:var(--bad)">' + esc(u.name) + " chưa có câu nào phù hợp.</b>";
  }
}

async function saveRecord(type){
  const err = $("#rc-err"), fail = m => { if (err) err.textContent = m; };
  if (!canFileRecord(ME)) return fail("Bạn không có quyền lập bản ghi này.");
  const subjectId = $("#rc-user").value;
  const pick = $("#rc-crit").value;
  const detail = ($("#rc-detail").value || "").trim();
  const luc = ($("#rc-luc").value || "").trim();
  if (!subjectId || !pick) return fail("Chọn người và mục cần gắn.");
  if (!luc) return fail("Chọn thời điểm sự việc xảy ra.");
  const tLuc = new Date(luc);
  if (isNaN(tLuc.getTime())) return fail("Thời điểm không hợp lệ.");
  if (tLuc.getTime() > Date.now() + 6e4) return fail("Không ghi được sự việc ở thì tương lai.");
  if (detail.length < 10) return fail("Mô tả sự việc rõ hơn, tối thiểu 10 ký tự.");
  const u = user(subjectId);
  const isB = pick.startsWith("B:");
  recs().push({
    id: uid("rc"), type, subjectId, reporterId: ME.id,
    critId: isB ? pick : pick,
    critCode: isB ? boundaryText(u, pick) : (crit(pick) || {}).code || "",
    isBoundary: isB,
    detail, xayRaLuc: tLuc.toISOString(), period: kyTu(luc),
    anh: await Promise.all(RC_ANH.map(async a =>
      Object.assign({ ten: a.ten }, await catAnh(a.data, a.ten)))),
    status: "pending", kyQL: null, kyNS: null, tuChoi: null, khieuNai: null,
    decidedBy: null, decidedAt: null,
    note: "", reply: "", createdAt: nowISO()
  });
  const ok = await Storage.save(DB);
  if (!ok){
    recs().pop();
    return fail("Bộ nhớ trình duyệt đã đầy, chưa lưu được. Bớt ảnh hoặc xuất bớt dữ liệu cũ ở Quản lý → Dữ liệu.");
  }
  RC_ANH = []; closeModal(); render();
  toast(type === "vi_pham"
    ? "Đã lập biên bản. Có hiệu lực ngay, người được nêu có 2 ngày làm việc để nêu ý kiến."
    : "Đã gửi phiếu ghi nhận. Chờ Phòng Nhân sự duyệt.");
}

async function decideRecord(id, status){
  const r = (DB.records || []).find(x => x.id === id); if (!r) return;
  if (status === "rejected"){
    if (!canKy(ME, r)){ toast("Bạn không có quyền xử lý bản ghi này."); return; }
    r.tuChoi = { by: ME.id, at: nowISO() };
    chotTrangThai(r); await persist(); render(); toast("Đã bác bỏ.");
    return;
  }
  if (!canKyNS(ME, r)){ toast("Chỉ Phòng Nhân sự duyệt phiếu ghi nhận."); return; }
  r.kyNS = { by: ME.id, at: nowISO() };
  chotTrangThai(r);
  await persist(); render();
  toast("Đã duyệt phiếu ghi nhận, điểm cập nhật theo.");
}

/* ---- Tệp kèm theo đơn kháng nghị: ảnh hoặc video ---- */
const KN_TEP_TOI_DA = 3;
/** Video nặng hơn ảnh nhiều. Bản chạy trên máy chủ lưu được rộng tay hơn
    bản chạy trong trình duyệt, vì trình duyệt chỉ có vài MB bộ nhớ. */
const videoToiDaMB = () => (Storage.mode === "may-chu" ? 20 : 3);
let KN_TEP = [];

/** Đọc nguyên tệp thành dữ liệu nhúng. Video không nén được trong trình duyệt. */
function docTep(file){
  return new Promise((ok, loi) => {
    const fr = new FileReader();
    fr.onerror = () => loi(new Error("Không đọc được tệp " + file.name));
    fr.onload  = () => ok(fr.result);
    fr.readAsDataURL(file);
  });
}

/** Chọn ảnh hoặc video kèm đơn kháng nghị. */
async function chonTepKN(input){
  const err = $("#kn-err"), xem = $("#kn-xem");
  const files = [].slice.call(input.files || []);
  input.value = "";
  for (let i = 0; i < files.length; i++){
    const f = files[i];
    if (KN_TEP.length >= KN_TEP_TOI_DA){
      if (err) err.textContent = "Chỉ kèm được tối đa " + KN_TEP_TOI_DA + " tệp.";
      break;
    }
    const laVideo = /^video\//.test(f.type);
    const nguong = laVideo ? videoToiDaMB() : ANH_TOI_DA_MB;
    if (f.size > nguong * 1024 * 1024){
      if (err) err.textContent = (laVideo ? "Video " : "Ảnh ") + f.name + " nặng " +
        (f.size / 1048576).toFixed(1) + "MB, vượt mức " + nguong + "MB" +
        (laVideo && Storage.mode !== "may-chu"
          ? ". Bản chạy trong trình duyệt chỉ giữ được video rất ngắn — quay lại một đoạn ngắn hơn, hoặc chụp ảnh." : ".");
      continue;
    }
    try{
      const data = laVideo ? await docTep(f) : await nenAnh(f);
      KN_TEP.push({ data: data, ten: f.name, kieu: laVideo ? "video" : "anh",
                    goc: f.size, sau: Math.round(data.length * 0.75) });
      if (err) err.textContent = "";
    }catch(e){ if (err) err.textContent = e.message; }
  }
  veTepKN();
}

function veTepKN(){
  const xem = $("#kn-xem");
  if (!xem) return;
  xem.innerHTML = KN_TEP.map(function (a, i){
    return '<div class="anh-o">' +
      (a.kieu === "video"
        ? '<video src="' + a.data + '" style="width:100%;height:100%;object-fit:cover" muted playsinline></video>' +
          '<span class="dl" style="left:4px;right:auto">🎬</span>'
        : '<img src="' + a.data + '" alt="">') +
      '<button type="button" class="bo" data-bo-kn="' + i + '" title="Bỏ tệp">✕</button>' +
      '<span class="dl">' + (a.goc / 1048576).toFixed(1) + "MB" +
        (a.kieu === "anh" ? " → " + Math.round(a.sau / 1024) + "KB" : "") + "</span></div>";
  }).join("");
}

async function saveKhieuNai(id){
  const r = (DB.records || []).find(x => x.id === id); if (!r) return;
  if (r.subjectId !== ME.id){
    $("#kn-err").textContent = "Chỉ người bị nêu trong bản ghi mới gửi được ý kiến."; return;
  }
  // Kiểm lại hạn ngay lúc bấm gửi, phòng khi trang mở từ trước rồi để lâu.
  if (!conHanKhangNghi(r)){
    $("#kn-err").textContent =
      "Đã hết hạn kháng nghị lúc " + fmtHan(hanKhangNghi(r)) + ". Gặp Phòng Nhân sự để trao đổi trực tiếp.";
    return;
  }
  const t = ($("#kn-text").value || "").trim();
  if (t.length < 15){ $("#kn-err").textContent = "Viết rõ hơn, tối thiểu 15 ký tự."; return; }

  const oLuc = $("#kn-luc");
  const luc = oLuc ? oLuc.value : "";
  if (!luc){ $("#kn-err").textContent = "Chọn thời điểm bạn cho là sự việc đã xảy ra."; return; }
  const tLuc = new Date(luc);
  if (isNaN(tLuc.getTime())){ $("#kn-err").textContent = "Thời điểm không hợp lệ."; return; }
  if (tLuc.getTime() > Date.now() + 6e4){
    $("#kn-err").textContent = "Không ghi được thời điểm ở thì tương lai."; return;
  }

  r.khieuNai = { text: t, at: nowISO(), by: ME.id, status: "open",
                 xayRaLuc: tLuc.toISOString(),
                 tep: KN_TEP.map(a => ({ data: a.data, ten: a.ten, kieu: a.kieu })),
                 decidedBy: null, decidedAt: null, note: "" };
  const ok = await Storage.save(DB);
  if (ok === false){
    r.khieuNai = null;
    $("#kn-err").textContent =
      "Chưa lưu được, có thể do tệp kèm quá nặng. Bỏ bớt ảnh hoặc video rồi gửi lại.";
    return;
  }
  KN_TEP = []; closeModal(); render();
  toast("Đã gửi Trưởng phòng Nhân sự.");
}

const SESSION = "sao-nhan-su/session";
/* Ghi nhớ đăng nhập: bật thì phiên nằm ở bộ nhớ lâu dài, tắt thì chỉ sống
   tới khi đóng trình duyệt. Phiên vẫn gắn với bản băm mật khẩu, nên đổi mật
   khẩu là mọi thiết bị khác bị đăng xuất. */
let NHO = true;
function setSession(u, ghiNho){
  if (ghiNho !== undefined) NHO = !!ghiNho;
  const val = u ? (u.code + "|" + String(u.pwHash || "").slice(-16)) : "";
  try{ localStorage.removeItem(SESSION); }catch(e){}
  try{ sessionStorage.removeItem(SESSION); }catch(e){}
  if (!u) return;
  try{ (NHO ? localStorage : sessionStorage).setItem(SESSION, val); }catch(e){}
}
function readSession(){
  try{
    let raw = "";
    try{ raw = localStorage.getItem(SESSION) || ""; }catch(e){}
    if (raw) NHO = true;
    if (!raw){ try{ raw = sessionStorage.getItem(SESSION) || ""; if (raw) NHO = false; }catch(e){} }
    if (!raw.includes("|")) return null;
    const [code, sig] = raw.split("|");
    const u = DB.users.find(x => String(x.code).toUpperCase() === String(code).toUpperCase());
    if (!u || u.active === false) return null;
    return String(u.pwHash || "").slice(-16) === sig ? u : null;
  }catch(e){ return null; }
}

async function doLogin(code, pw){
  const c = String(code || "").trim().toUpperCase();
  const err = $("#loginerr");
  const fail = m => { if (err) err.textContent = m; };
  if (!c || !pw) return fail("Nhập cả mã nhân sự và mật khẩu.");

  /* ── CÓ MÁY CHỦ: máy chủ kiểm mật khẩu, không phải trình duyệt ──
     Đây là khác biệt lớn nhất giữa hai đường. Ở đường cục bộ, mật khẩu băm nằm
     ngay trong dữ liệu tải về, nên ai mở Console cũng lấy được để thử phá. Ở
     đường máy chủ, băm không bao giờ rời khỏi Google: app gửi mã và mật khẩu
     lên, nhận về một token đã ký. Sai gì cũng chỉ nhận đúng một câu trả lời. */
  if (Storage.coMayChu()){
    try {
      const d = await Storage.goi("dangNhap", { maNV: c, matKhau: pw }, true);
      Storage.datToken(d.token);
      DB = d.db;
      ME = (DB.users || []).find(x => x.id === d.meId) || null;
      if (!ME){ Storage.datToken(""); return fail("Máy chủ trả về tài khoản không rõ."); }
      VIEW = { tab:"home", profileId:null, adminTab:"criteria", boardSite:"all" };
      render();
      if (d.phaiDoiMatKhau) toast("Đổi mật khẩu ngay trong mục Tài khoản giúp em.");
      return;
    } catch (e) {
      return fail(e.message || "Mã hoặc mật khẩu không đúng.");
    }
  }

  const u = DB.users.find(x => String(x.code).toUpperCase() === c);
  // Thông báo chung cho cả sai mã lẫn sai mật khẩu — không tiết lộ mã nào có thật.
  if (!u) return fail("Mã hoặc mật khẩu không đúng.");
  if (u.active === false) return fail("Tài khoản đã bị khoá. Liên hệ quản lý.");
  if (!(await checkPw(u, pw))) return fail("Mã hoặc mật khẩu không đúng.");
  const oNho = $("#nho");
  ME = u; setSession(u, oNho ? oNho.checked : true);
  VIEW = { tab:"home", profileId:null, adminTab:"criteria", boardSite:"all" };
  render();
}

async function saveBulk(kind){
  const lines = ($("#bulk-text").value || "").split("\n").map(l => l.trim()).filter(Boolean);
  if (!lines.length){ toast("Chưa có nội dung."); return; }
  let n = 0;
  if (kind === "crit"){
    lines.forEach(l => {
      const p = l.split("|").map(x => x.trim());
      const tid = (VIEW.critPart && VIEW.critPart !== "kc") ? VIEW.critPart : null;
      const mk = (group, name, code) => ({ id:uid("cr"), code: code || "", gcode:(group||"X").slice(0,6),
        group: group || "Khác", mode:"ghi_nhan", name, scope:"all", trackId:tid,
        ngach: tid ? "chuyen_mon" : null, bac:"", weight:1, active:true });
      if (p.length === 1){ if (p[0]) { DB.criteria.push(mk("Khác", p[0], "")); n++; } return; }
      const [group, name, code] = p;
      if (!name) return;
      DB.criteria.push(mk(group, name, code));
      n++;
    });
  } else {
    const findOrAdd = (list, nm, pre) => {
      if (!nm) return null;
      let x = list.find(v => v.name.toLowerCase() === nm.toLowerCase());
      if (!x){ x = { id: uid(pre), name: nm }; list.push(x); }
      return x.id;
    };
    const levelKey = nm => {
      const t = String(nm||"").trim().toLowerCase();
      const hit = LEVELS.find(l => l.name.toLowerCase() === t || l.k === t);
      return hit ? hit.k : "staff";
    };
    DB.depts = DB.depts || []; DB.sites = DB.sites || [];
    for (const l of lines){
      const p = l.split("|").map(x => x.trim());
      const [code, name, titleVi, deptNm, siteNm, lvl, hear] = p;
      if (!name || !code) continue;
      if (DB.users.some(u => String(u.code).toUpperCase() === code.toUpperCase())) continue;
      const level = levelKey(lvl);
      const nu = {
        id: uid("u"), code: code.toUpperCase(), name,
        titleVi: titleVi || "", titleEn: "",
        deptId: findOrAdd(DB.depts, deptNm, "dp"),
        siteId: findOrAdd(DB.sites, siteNm, "si"),
        trackId: null,
        hearing: /điếc/i.test(hear||"") ? "deaf" : (/nói/i.test(hear||"") ? "hearing" : ""),
        level, role: roleFromLevel(level),
        active: true, joinedAt: nowISO()
      };
      await setPw(nu, DEFAULT_PW, true);
      DB.users.push(nu);
      n++;
    }
  }
  await persist(); closeModal(); render(); toast("Đã nhập " + n + " mục.");
}

/* Xuất bằng chứng cho phiếu đánh giá: mỗi dòng là một mã câu kèm toàn bộ
   sự việc đã duyệt của câu đó trong kỳ. Dán vào cột "Bằng chứng: sự việc
   và thời điểm" của phiếu, hoặc dùng VLOOKUP theo mã câu. */
function bangChung(userId, period){
  const evs = recordsOf(userId, period).slice()
    .sort((a,b) => String(a.xayRaLuc||a.createdAt).localeCompare(String(b.xayRaLuc||b.createdAt)));
  const theoMa = {};
  evs.forEach(e => {
    const ma = e.critCode || "(không mã)";
    const gio = fmtGio(e.xayRaLuc || e.createdAt);
    const dau = e.isBoundary ? "RANH GIỚI" : (e.type === "vi_pham" ? "Vi phạm" : "Ghi nhận");
    const nguoi = (user(e.reporterId) || {}).name || "?";
    const anh = (e.anh || []).length ? " [có " + e.anh.length + " ảnh]" : "";
    (theoMa[ma] = theoMa[ma] || []).push(dau + " · " + gio + " · " + e.detail + " (" + nguoi + " lập)" + anh);
  });
  return Object.keys(theoMa).map(ma => ({ ma, noiDung: theoMa[ma].join(" | ") }));
}

/* ---- SỔ SỰ VIỆC TỪNG NGƯỜI ----

   Thống kê đếm; sổ này KỂ. Mỗi biên bản và mỗi phiếu ghi nhận một dòng, đủ
   chi tiết để đọc lại mà hiểu chuyện gì đã xảy ra.

   ⛔ LẤY MỌI TRẠNG THÁI, không chỉ cái đã duyệt. Phiếu ghi nhận đang chờ, biên
   bản bị từ chối, sự việc đang có kháng nghị — đó chính là những thứ người ta
   cần lần lại khi có tranh chấp. Chỉ xuất phần đã duyệt là xuất một nửa câu
   chuyện, mà nửa bị bỏ lại thường là nửa quan trọng hơn. */

const TEN_TRANG_THAI = {

};

function _tenAi(id){ return (user(id) || {}).name || ""; }

function _khangNghiChu(r){
  if (!r.khieuNai) return "";
  const kn = r.khieuNai;
  const tt = kn.status === "open" ? "đang mở"
           : kn.status === "resolved" ? "đã xử" : (kn.status || "");
  return tt + (kn.at ? " · gửi " + fmtGio(kn.at) : "") +
         (kn.note ? " · " + String(kn.note).replace(/\s+/g, " ") : "") +
         (kn.decidedBy ? " · " + _tenAi(kn.decidedBy) + " xử " +
           (kn.decidedAt ? fmtGio(kn.decidedAt) : "") : "");
}

/** Mười sáu cột chi tiết, dùng chung cho sổ cả nhà và sổ một người. */
const COT_CHI_TIET = [
  ["Mã NV", 11], ["Họ và tên", 22], ["Kỳ", 10], ["Loại", 18],
  ["Mã câu", 11], ["Nhóm tiêu chí", 28], ["Nội dung tiêu chí", 52],
  ["Sự việc đã xảy ra", 60], ["Xảy ra lúc", 18], ["Người lập", 20],
  ["Trạng thái", 12], ["Nhân sự ký", 20], ["Lý do từ chối", 34],
  ["Kháng nghị", 44], ["Ảnh", 7], ["Số hiệu", 16]
];

function _dongChiTiet(r){
  const u = user(r.subjectId) || {};
  const c = (DB.criteria || []).find(x => x.code === r.critCode);
  const loai = r.isBoundary ? "Vi phạm ranh giới"
             : r.type === "ghi_nhan" ? "Phiếu ghi nhận" : "Biên bản vi phạm";
  return [
    u.code || "", u.name || "", r.period || "", loai,
    r.critCode || "", (c && c.group) || "",
    (c && (c.text || c.name)) || "(không còn trong bộ tiêu chí)",
    String(r.detail || "").replace(/\s+/g, " "),
    fmtGio(r.xayRaLuc || r.createdAt),
    _tenAi(r.reporterId),
    TEN_TRANG_THAI[r.status] || r.status || "",
    r.kyNS ? _tenAi(r.kyNS.by) + (r.kyNS.at ? " · " + fmtGio(r.kyNS.at) : "") : "",
    r.tuChoi ? (_tenAi(r.tuChoi.by) + (r.tuChoi.at ? " · " + fmtGio(r.tuChoi.at) : "") +
                (r.note ? " · " + String(r.note).replace(/\s+/g, " ") : "")) : "",
    _khangNghiChu(r),
    (r.anh || []).length || "",
    r.id || ""
  ];
}

function _toMauDong(row, r){
  row.alignment = { vertical: "top", wrapText: true };
  if (r.isBoundary)
    row.eachCell(c => { c.font = { color: { argb: "FFA8452F" }, bold: true }; });
  else if (r.type === "ghi_nhan")
    row.getCell(4).font = { color: { argb: "FF2F6B46" } };
  if (r.status === "pending")
    row.getCell(11).font = { bold: true, color: { argb: "FF8A6A12" } };
  if (r.status === "rejected")
    row.getCell(11).font = { color: { argb: "FF8E9A83" }, strike: true };
}

/**
 * SỔ CỦA MỘT NGƯỜI.
 *
 * Bố cục khác hẳn sổ cả nhà, vì dùng vào việc khác: cái này in ra hoặc gửi
 * thẳng cho chính người đó xem. Nên mở đầu bằng thông tin của họ và sáu con
 * số, rồi mới tới danh sách — đọc từ trên xuống là hiểu, không phải đi lọc.
 *
 * ⛔ Không kèm cột nào của người khác. Đưa nhầm sự việc của đồng nghiệp vào sổ
 * cá nhân là chuyện không sửa lại được sau khi đã gửi đi.
 */
async function taoSoMotNguoi(ky, uid){
  const u = user(uid);
  if (!u) throw new Error("Không tìm thấy nhân sự này.");
  const k = _kyLoc(ky);
  const nhan = ky === "*" ? "tất cả các kỳ" : periodLabel(ky);

  const cua = recs().filter(r => r.subjectId === uid && (!k || r.period === k))
    .sort((a, b) => String(b.xayRaLuc || b.createdAt)
                      .localeCompare(String(a.xayRaLuc || a.createdAt)));

  const wb = new ExcelJS.Workbook();
  wb.creator = "Ứng dụng đánh giá nhân sự";
  const ws = wb.addWorksheet("Sổ sự việc");

  const rongCot = COT_CHI_TIET.length;
  const tieu = (r, chu, co, dam) => {
    ws.mergeCells(r, 1, r, rongCot);
    const c = ws.getCell(r, 1);
    c.value = chu;
    c.font = { size: co || 11, bold: !!dam };
    c.alignment = { vertical: "middle" };
  };

  tieu(1, "SỔ SỰ VIỆC CÁ NHÂN", 15, true);
  ws.getRow(1).height = 26;
  tieu(2, (u.name || "") + "  ·  " + (u.code || "") + "  ·  " + (u.titleVi || ""), 12, true);
  tieu(3, [tenPhong(u), tenTuyen(u), tenDiem(u)].filter(Boolean).join("  ·  ") ||
          "(chưa gán phòng ban và tuyến)", 10);
  tieu(4, "Kỳ " + nhan + "  ·  xuất lúc " + fmtGio(nowISO()), 10);
  ws.getCell(4, 1).font = { size: 10, color: { argb: "FF666666" } };

  const d = f => cua.filter(f).length;
  const so = [
    ["Biên bản đã duyệt", d(r => r.type === "vi_pham" && r.status === "approved" && !r.isBoundary)],
    ["Phiếu ghi nhận đã duyệt", d(r => r.type === "ghi_nhan" && r.status === "approved")],
    ["Đang chờ duyệt", d(r => r.status === "pending")],
    ["Bị từ chối", d(r => r.status === "rejected")],
    ["Có kháng nghị", d(r => !!r.khieuNai)],
    ["Vi phạm ranh giới", d(r => r.isBoundary)]
  ];
  ws.getCell(6, 1).value = "TỔNG CỘNG " + cua.length + " SỰ VIỆC";
  ws.getCell(6, 1).font = { bold: true, size: 11 };
  so.forEach(([ten, n], i) => {
    const r = 7 + i;
    ws.getCell(r, 1).value = "   " + ten;
    ws.getCell(r, 3).value = n;
    ws.getCell(r, 3).font = { bold: true };
    if (n && (ten === "Vi phạm ranh giới"))
      [1, 3].forEach(c => { ws.getCell(r, c).font = { bold: true, color: { argb: "FFA8452F" } }; });
  });

  // Phần điểm, để người đọc hiểu sự việc dẫn tới đâu.
  if (k){
    const st = statsOf(uid, k);
    ws.getCell(14, 1).value = "KẾT QUẢ KỲ NÀY";
    ws.getCell(14, 1).font = { bold: true, size: 11 };
    [["Điểm tổng", st.raw == null ? "—" : Number(st.raw.toFixed(2)) + " / " + (st.thangPhieu || 5)],
     ["Tỷ lệ đạt", st.tyLeCuoi == null ? "—" : st.tyLeCuoi.toFixed(1) + "%"],
     ["Bậc cách làm việc", st.bac || "—"]
    ].forEach(([ten, v], i) => {
      ws.getCell(15 + i, 1).value = "   " + ten;
      ws.getCell(15 + i, 3).value = v;
      ws.getCell(15 + i, 3).font = { bold: true };
    });
  }

  const dongHead = k ? 19 : 14;
  const hd = ws.getRow(dongHead);
  COT_CHI_TIET.forEach((c, i) => {
    hd.getCell(i + 1).value = c[0];
    ws.getColumn(i + 1).width = c[1];
  });
  hd.font = { bold: true, color: { argb: "FFFFFFFF" } };
  hd.alignment = { vertical: "middle", wrapText: true };
  hd.height = 30;
  hd.eachCell(c => { c.fill = { type: "pattern", pattern: "solid",
                                fgColor: { argb: "FF55842A" } }; });

  cua.forEach(r => { _toMauDong(ws.addRow(_dongChiTiet(r)), r); });
  if (!cua.length){
    ws.mergeCells(dongHead + 1, 1, dongHead + 1, rongCot);
    ws.getCell(dongHead + 1, 1).value = "Kỳ này chưa có biên bản hay phiếu ghi nhận nào.";
    ws.getCell(dongHead + 1, 1).font = { italic: true, color: { argb: "FF8E9A83" } };
  }
  ws.views = [{ state: "frozen", ySplit: dongHead }];

  return { buf: await wb.xlsx.writeBuffer(), nhan: nhan, motNguoi: true,
           ten: u.name || "", ma: u.code || "", soSuViec: cua.length,
           cho: d(r => r.status === "pending"),
           tuChoi: d(r => r.status === "rejected"),
           khangNghi: d(r => !!r.khieuNai) };
}

async function taoSoSuViec(ky, gomThu){
  const k = _kyLoc(ky);
  const ds = nhanSuThat(gomThu);
  const nhan = ky === "*" ? "tất cả các kỳ" : periodLabel(ky);

  // Mọi trạng thái, chỉ bỏ dữ liệu thử.
  const tatCa = recs().filter(r => {
    if (k && r.period !== k) return false;
    return gomThu || !isDemo(user(r.subjectId));
  });

  const wb = new ExcelJS.Workbook();
  wb.creator = "Ứng dụng đánh giá nhân sự";

  /* ── TRANG 1: ĐẾM THEO NGƯỜI ─────────────────────────────── */
  const w1 = wb.addWorksheet("Đếm theo người");
  _dat(w1, [["Mã", 12], ["Họ và tên", 24], ["Phòng ban", 20], ["Tuyến", 22],
            ["Biên bản đã duyệt", 12], ["Ghi nhận đã duyệt", 12],
            ["Chờ duyệt", 10], ["Bị từ chối", 10], ["Có kháng nghị", 12],
            ["Vi phạm ranh giới", 12], ["Tổng sự việc", 11]], true);

  const theoNguoi = {};
  tatCa.forEach(r => { (theoNguoi[r.subjectId] = theoNguoi[r.subjectId] || []).push(r); });

  ds.map(u => {
    const cua = theoNguoi[u.id] || [];
    const d = (f) => cua.filter(f).length;
    return { u, cua,
      vp: d(r => r.type === "vi_pham" && r.status === "approved" && !r.isBoundary),
      gn: d(r => r.type === "ghi_nhan" && r.status === "approved"),
      cho: d(r => r.status === "pending"),
      tc: d(r => r.status === "rejected"),
      kn: d(r => !!r.khieuNai),
      rg: d(r => r.isBoundary) };
  })
  .sort((a, b) => (b.cua.length - a.cua.length) || String(a.u.code).localeCompare(String(b.u.code)))
  .forEach(x => {
    const r = w1.addRow([x.u.code || "", x.u.name || "", tenPhong(x.u), tenTuyen(x.u),
      x.vp, x.gn, x.cho, x.tc, x.kn, x.rg, x.cua.length]);
    if (x.rg) r.eachCell(c => { c.font = { color: { argb: "FFA8452F" } }; });
    else if (x.kn || x.cho) r.getCell(x.kn ? 9 : 7).font = { bold: true, color: { argb: "FF8A6A12" } };
  });

  /* ── TRANG 2: CHI TIẾT TỪNG SỰ VIỆC ──────────────────────── */
  const w2 = wb.addWorksheet("Chi tiết sự việc");
  _dat(w2, COT_CHI_TIET, true);

  const sapXep = tatCa.slice().sort((a, b) => {
    const ua = _tenAi(a.subjectId), ub = _tenAi(b.subjectId);
    return String(a.subjectId).localeCompare(String(b.subjectId)) ||
           String(b.xayRaLuc || b.createdAt).localeCompare(String(a.xayRaLuc || a.createdAt));
  });

  sapXep.forEach(r => { _toMauDong(w2.addRow(_dongChiTiet(r)), r); });

  if (!sapXep.length) w2.addRow(["—", "Kỳ này chưa có sự việc nào"]);

  return { buf: await wb.xlsx.writeBuffer(), nhan: nhan,
           soNguoi: ds.length, soSuViec: tatCa.length,
           cho: tatCa.filter(r => r.status === "pending").length,
           tuChoi: tatCa.filter(r => r.status === "rejected").length,
           khangNghi: tatCa.filter(r => !!r.khieuNai).length };
}

/* ---- THỐNG KÊ ĐIỂM VÀ LỖI ----

   Bảng lương trả lời "trả bao nhiêu". Tệp này trả lời câu khác: "cả nhà đang
   vướng ở đâu". Năm trang, mỗi trang một câu hỏi:

     Tổng quan     bao nhiêu người ở bậc nào, điểm trung bình bao nhiêu
     Lỗi hay gặp   câu nào bị lập biên bản nhiều nhất, dính bao nhiêu người
     Theo nhóm     nhóm tiêu chí nào đang căng
     Theo phòng    phòng và tuyến nào điểm thấp, nhiều biên bản
     Theo người    ai nhiều biên bản, ai nhiều ghi nhận

   ⚠️ Một lỗi 12 lần của MỘT người khác hẳn 12 người mỗi người một lần: cái đầu
   là chuyện cá nhân, cái sau là hệ thống đang hỏng. Nên trang Lỗi hay gặp luôn
   đếm CẢ HAI — số lần và số người. */

function _kyLoc(ky){ return ky === "*" ? null : ky; }

function suKienThongKe(ky, gomThu){
  const k = _kyLoc(ky);
  return recs().filter(r => {
    if (r.status !== "approved") return false;
    if (k && r.period !== k) return false;
    if (!gomThu && isDemo(user(r.subjectId))) return false;
    return true;
  });
}

/**
 * Danh sách người để xuất.
 *
 * ⛔ MẶC ĐỊNH BỎ TÀI KHOẢN THỬ. Nguyễn Văn Test có cờ demo, dựng ra để chạy
 * thử luồng chứ không phải người thật. Lọt vào bảng lương là một dòng lương
 * cho người không tồn tại.
 *
 * ⚠️ Chỗ này từng lệch nhau giữa ba màn hình: thống kê và sổ sự việc đã bỏ tài
 * khoản thử, còn bảng lương thì không — tức là đúng cái tệp chạm tới tiền lại
 * là cái lỏng nhất. Nay cả ba dùng chung hàm này.
 *
 * gomThu = true khi người dùng cố ý tích ô "Gồm cả tài khoản thử" để thử một
 * luồng xuất mà không cần đụng vào dữ liệu người thật.
 */
function nhanSuThat(gomThu){
  return DB.users.filter(u => u.active !== false &&
    u.id !== "u_admin" && u.id !== "u_admin_test" &&
    (gomThu || !isDemo(u)));
}

/** Ô tích dùng chung cho ba màn hình xuất. Chỉ hiện khi kho có tài khoản thử. */
function oGomThu(id){
  const n = DB.users.filter(u => isDemo(u) && u.active !== false).length;
  if (!n) return "";
  return '<label class="row" style="gap:7px;align-items:center;margin:0 0 12px;cursor:pointer">' +
    '<input type="checkbox" id="' + id + '">' +
    '<span class="tiny muted">Gồm cả ' + n + ' tài khoản thử ' +
      "(Nguyễn Văn Test và tương tự) — để chạy thử, đừng bật khi xuất bảng lương thật.</span>" +
    "</label>";
}
function daTich(id){ const o = $("#" + id); return !!(o && o.checked); }

function _dat(ws, cot, tieuDe){
  ws.getRow(1).values = cot.map(c => c[0]);
  cot.forEach((c, i) => { ws.getColumn(i + 1).width = c[1]; });
  const h = ws.getRow(1);
  h.font = { bold: true, color: { argb: "FFFFFFFF" } };
  h.alignment = { vertical: "middle", wrapText: true };
  h.height = 30;
  h.eachCell(c => { c.fill = { type: "pattern", pattern: "solid",
                               fgColor: { argb: "FF55842A" } }; });
  ws.views = [{ state: "frozen", ySplit: 1 }];
  if (tieuDe) ws.autoFilter = { from: { row: 1, column: 1 },
                                to: { row: 1, column: cot.length } };
}

async function taoThongKe(ky, gomThu){
  const cfg = scoreCfg();
  const evs = suKienThongKe(ky, gomThu);
  const ds  = nhanSuThat(gomThu);
  const nhan = ky === "*" ? "tất cả các kỳ" : periodLabel(ky);

  const wb = new ExcelJS.Workbook();
  wb.creator = "Ứng dụng đánh giá nhân sự";

  /* ── 1. TỔNG QUAN ────────────────────────────────────────── */
  const st1 = ds.map(u => statsOf(u.id, _kyLoc(ky)));
  const coDiem = st1.filter(s => s.raw != null);
  const tbChung = coDiem.length
    ? coDiem.reduce((a, s) => a + s.raw, 0) / coDiem.length : null;
  const theoBac = {};
  st1.forEach(s => { if (s.bac) theoBac[s.bac] = (theoBac[s.bac] || 0) + 1; });

  const w1 = wb.addWorksheet("Tổng quan");
  _dat(w1, [["Chỉ số", 34], ["Giá trị", 16], ["Ghi chú", 52]]);
  const vp = evs.filter(e => e.type === "vi_pham" && !e.isBoundary).length;
  const rg = evs.filter(e => e.isBoundary).length;
  const gn = evs.filter(e => e.type === "ghi_nhan").length;
  [
    ["Kỳ thống kê", nhan, ""],
    ["Số nhân sự", ds.length, ds.filter(u => !u.trackId).length + " người chưa gán tuyến"],
    ["Điểm trung bình toàn nhà", tbChung == null ? "—" : Number(tbChung.toFixed(2)),
      "trên thang " + cfg.cap],
    ["Tổng biên bản vi phạm", vp, ""],
    ["Trong đó vi phạm ranh giới", rg, rg ? "Chặn cả hai kết quả, hội đồng quyết" : ""],
    ["Tổng phiếu ghi nhận", gn, ""],
    ["Người có ít nhất một sự việc",
      new Set(evs.map(e => e.subjectId)).size,
      "trên " + ds.length + " người"],
    ["", "", ""],
    ["PHÂN BỐ BẬC CÁCH LÀM VIỆC", "", "Bậc quyết định hệ số P2, tức tiền tháng đó"]
  ].forEach(r => w1.addRow(r));
  for (let b = 1; b <= 5; b++){
    const n = theoBac[b] || 0;
    w1.addRow(["   Bậc " + b + " — hệ số " + (cfg.heSoP2 || [])[b - 1], n,
      ds.length ? (n / ds.length * 100).toFixed(0) + "% số người" : ""]);
  }
  w1.getRow(10).font = { bold: true };
  w1.getColumn(2).alignment = { horizontal: "left" };

  /* ── 2. LỖI HAY GẶP ──────────────────────────────────────── */
  const theoCau = {};
  evs.filter(e => e.type === "vi_pham").forEach(e => {
    const ma = e.critCode || "(không mã)";
    const t = theoCau[ma] || (theoCau[ma] = { lan: 0, nguoi: new Set(), rg: 0 });
    t.lan++; t.nguoi.add(e.subjectId);
    if (e.isBoundary) t.rg++;
  });
  const w2 = wb.addWorksheet("Lỗi hay gặp");
  _dat(w2, [["Mã câu", 12], ["Nội dung tiêu chí", 62], ["Nhóm", 26],
            ["Số lần", 9], ["Số người dính", 12], ["Lần/người", 10],
            ["Ranh giới", 10]], true);
  Object.keys(theoCau)
    .sort((a, b) => theoCau[b].lan - theoCau[a].lan)
    .forEach(ma => {
      const t = theoCau[ma];
      const c = (DB.criteria || []).find(x => x.code === ma);
      w2.addRow([ma, (c && (c.text || c.name)) || "(không còn trong bộ tiêu chí)",
        (c && c.group) || "", t.lan, t.nguoi.size,
        Number((t.lan / t.nguoi.size).toFixed(1)), t.rg || ""]);
    });
  if (!Object.keys(theoCau).length)
    w2.addRow(["—", "Kỳ này chưa có biên bản vi phạm nào", "", 0, 0, "", ""]);

  /* ── 3. THEO NHÓM TIÊU CHÍ ───────────────────────────────── */
  const theoNhom = {};
  evs.forEach(e => {
    const c = (DB.criteria || []).find(x => x.code === e.critCode);
    const ten = (c && c.group) || "(không rõ nhóm)";
    const t = theoNhom[ten] || (theoNhom[ten] = { vp: 0, gn: 0, nguoi: new Set() });
    if (e.type === "ghi_nhan") t.gn++; else t.vp++;
    t.nguoi.add(e.subjectId);
  });
  const w3 = wb.addWorksheet("Theo nhóm");
  _dat(w3, [["Nhóm tiêu chí", 56], ["Biên bản", 11], ["Ghi nhận", 11],
            ["Số người liên quan", 15], ["Chênh lệch", 11]], true);
  Object.keys(theoNhom)
    .sort((a, b) => (theoNhom[b].vp - theoNhom[b].gn) - (theoNhom[a].vp - theoNhom[a].gn))
    .forEach(ten => {
      const t = theoNhom[ten];
      w3.addRow([ten, t.vp, t.gn, t.nguoi.size, t.vp - t.gn]);
    });
  if (!Object.keys(theoNhom).length) w3.addRow(["Kỳ này chưa có sự việc nào", 0, 0, 0, 0]);

  /* ── 4. THEO PHÒNG BAN VÀ TUYẾN ──────────────────────────── */
  const gom = (khoa, ten) => {
    const g = {};
    ds.forEach(u => {
      const k = ten(u) || "(chưa gán)";
      const t = g[k] || (g[k] = { n: 0, diem: [], vp: 0, gn: 0 });
      t.n++;
      const s = statsOf(u.id, _kyLoc(ky));
      if (s.raw != null) t.diem.push(s.raw);
      t.vp += s.nViPham || 0; t.gn += s.nGhiNhan || 0;
    });
    return g;
  };
  const w4 = wb.addWorksheet("Theo phòng và tuyến");
  _dat(w4, [["Nhóm", 12], ["Tên", 40], ["Số người", 10],
            ["Điểm trung bình", 14], ["Biên bản", 10], ["Ghi nhận", 10]], true);
  [["Phòng ban", tenPhong], ["Tuyến", tenTuyen], ["Điểm làm việc", tenDiem]]
    .forEach(([nhan2, ham]) => {
      const g = gom(null, ham);
      Object.keys(g).sort().forEach(k => {
        const t = g[k];
        w4.addRow([nhan2, k, t.n,
          t.diem.length ? Number((t.diem.reduce((a, b) => a + b, 0) / t.diem.length).toFixed(2)) : "",
          t.vp, t.gn]);
      });
    });

  /* ── 5. THEO NGƯỜI ───────────────────────────────────────── */
  const w5 = wb.addWorksheet("Theo người");
  _dat(w5, [["Mã", 12], ["Họ và tên", 24], ["Phòng ban", 20], ["Tuyến", 22],
            ["Điểm /5", 10], ["Bậc", 7], ["Biên bản", 10], ["Ghi nhận", 10],
            ["Lỗi hay mắc nhất", 46]], true);
  ds.map(u => {
    const s = statsOf(u.id, _kyLoc(ky));
    const cua = evs.filter(e => e.subjectId === u.id && e.type === "vi_pham");
    const dem = {};
    cua.forEach(e => { dem[e.critCode] = (dem[e.critCode] || 0) + 1; });
    const hay = Object.keys(dem).sort((a, b) => dem[b] - dem[a])[0];
    return { u, s, hay: hay ? hay + " (" + dem[hay] + " lần)" : "" };
  })
  .sort((a, b) => (b.s.nViPham || 0) - (a.s.nViPham || 0) ||
                  ((a.s.raw == null ? 99 : a.s.raw) - (b.s.raw == null ? 99 : b.s.raw)))
  .forEach(({ u, s, hay }) => {
    const r = w5.addRow([u.code || "", u.name || "", tenPhong(u), tenTuyen(u),
      s.raw == null ? "" : Number(s.raw.toFixed(2)), s.bac || "",
      s.nViPham || 0, s.nGhiNhan || 0, hay]);
    if (s.blockers && s.blockers.length)
      r.eachCell(c => { c.font = { color: { argb: "FFA8452F" } }; });
  });

  return { buf: await wb.xlsx.writeBuffer(), soNguoi: ds.length,
           soSuViec: evs.length, soLoi: Object.keys(theoCau).length, nhan: nhan };
}

/* ---- BẢNG SỐ CẢ ĐỢT, ĐỂ TÍNH LƯƠNG ----

   Mỗi người một dòng, đủ số để phòng Nhân sự ghép thẳng vào bảng lương.
   Cột quyết định tiền là Hệ số P2, tra từ Bậc cách làm việc.

   ⚠️ Người chưa có dữ liệu trong kỳ vẫn ra một dòng, ghi rõ "chưa có" ở cột
   Ghi chú thay vì bỏ trống. Thiếu dòng thì lúc ghép lương không ai nhận ra ai
   bị sót; có dòng mà trống thì nhìn là thấy. */

const COT_BANG_LUONG = [
  ["Mã nhân sự",        14], ["Họ và tên",          24], ["Vị trí",           20],
  ["Cấp",               16], ["Phòng ban",          18], ["Điểm làm việc",    16],
  ["Tuyến",             22], ["Khung chung",        13], ["Ngạch chuyên môn", 15],
  ["Ngạch quản lý",     13], ["Điểm tổng /5",       12], ["Tỷ lệ đạt %",      11],
  ["Bậc cách làm việc", 11], ["Hệ số P2",           10], ["Biên bản",         10],
  ["Ghi nhận",          10], ["Chặn ranh giới",     13], ["Vi phạm bảo mật",  13],
  ["Ghi chú",           34]
];

function dongBangLuong(u, ky, cfg){
  const st = statsOf(u.id, ky);
  const kh = {};
  (st.perKhung || []).forEach(x => { kh[x.k] = x.tb; });

  const bac = st.bac;
  const heSo = bac ? (cfg.heSoP2 || [])[bac - 1] : null;
  const chan = !!(st.blockers && st.blockers.length);

  const gc = [];
  if (!st.hasData) gc.push("Kỳ này chưa có sự việc nào");
  if (chan) gc.push("Vi phạm ranh giới — kết quả bị chặn, hội đồng quyết");
  if (st.viPhamBaoMat) gc.push("Vi phạm bảo mật thu nhập — đã hạ 1 bậc, từ " + st.bacTho);
  if (!u.trackId) gc.push("Chưa gán tuyến, chỉ chấm khung chung");

  return [
    u.code || "", u.name || "", u.titleVi || "",
    capBacCua(u), tenPhong(u), tenDiem(u), tenTuyen(u),
    kh.kc == null ? "" : Number(kh.kc.toFixed(2)),
    kh.cm == null ? "" : Number(kh.cm.toFixed(2)),
    kh.ql == null ? "" : Number(kh.ql.toFixed(2)),
    st.raw == null ? "" : Number(st.raw.toFixed(2)),
    st.tyLeCuoi == null ? "" : Number(st.tyLeCuoi.toFixed(1)),
    bac || "", heSo == null ? "" : heSo,
    st.nViPham || 0, st.nGhiNhan || 0,
    chan ? "CÓ" : "", st.viPhamBaoMat ? "CÓ" : "",
    gc.join(" · ")
  ];
}

function capBacCua(u){ return u.capBac || u.titleVi || ""; }
function tenPhong(u){ const d = byId(DB.depts || [], u.deptId);  return (d && d.name) || ""; }
function tenDiem(u){  const s = byId(DB.sites || [], u.siteId);  return (s && s.name) || ""; }
function tenTuyen(u){ const t = track(u.trackId);                return (t && t.name) || ""; }

async function taoBangLuong(ky, gomThu){
  const cfg = scoreCfg();
  const ds = nhanSuThat(gomThu);
  ds.sort((a, b) => String(a.code || "").localeCompare(String(b.code || "")));

  const wb = new ExcelJS.Workbook();
  wb.creator = "Ứng dụng đánh giá nhân sự";
  const ws = wb.addWorksheet("Bảng lương " + ky, {
    views: [{ state: "frozen", xSplit: 2, ySplit: 4 }]
  });

  ws.mergeCells(1, 1, 1, COT_BANG_LUONG.length);
  ws.getCell(1, 1).value = "BẢNG SỐ ĐỂ TÍNH LƯƠNG · " + periodLabel(ky);
  ws.getCell(1, 1).font = { bold: true, size: 14 };
  ws.getCell(1, 1).alignment = { vertical: "middle" };
  ws.getRow(1).height = 26;

  ws.mergeCells(2, 1, 2, COT_BANG_LUONG.length);
  ws.getCell(2, 1).value = "Xuất lúc " + fmtGio(nowISO()) + " · " + ds.length +
    " nhân sự · Hệ số P2 tra theo Bậc cách làm việc: " +
    (cfg.heSoP2 || []).map((h, i) => "bậc " + (i + 1) + " → " + h).join(" · ");
  ws.getCell(2, 1).font = { size: 10, color: { argb: "FF666666" } };

  const hd = ws.getRow(4);
  COT_BANG_LUONG.forEach((c, i) => {
    hd.getCell(i + 1).value = c[0];
    ws.getColumn(i + 1).width = c[1];
  });
  hd.font = { bold: true, color: { argb: "FFFFFFFF" } };
  hd.alignment = { vertical: "middle", wrapText: true };
  hd.height = 32;
  hd.eachCell(c => { c.fill = { type: "pattern", pattern: "solid",
                                fgColor: { argb: "FF55842A" } }; });

  ds.forEach((u, i) => {
    const r = ws.addRow(dongBangLuong(u, ky, cfg));
    if (i % 2) r.eachCell(c => { c.fill = { type: "pattern", pattern: "solid",
                                            fgColor: { argb: "FFF4F7EE" } }; });
    // Cột chạm tới tiền tô đậm, để mắt bắt được ngay.
    r.getCell(13).font = { bold: true };
    r.getCell(14).font = { bold: true };
    r.getCell(14).numFmt = "0.00";
    [11, 12].forEach(c => { r.getCell(c).numFmt = "0.00"; });
    // Chặn ranh giới hoặc vi phạm bảo mật thì đánh dấu đỏ cả dòng.
    if (r.getCell(17).value === "CÓ" || r.getCell(18).value === "CÓ")
      r.eachCell(c => { c.font = Object.assign({}, c.font, { color: { argb: "FFA8452F" } }); });
  });

  ws.autoFilter = { from: { row: 4, column: 1 },
                    to:   { row: 4 + ds.length, column: COT_BANG_LUONG.length } };

  return { buf: await wb.xlsx.writeBuffer(), soNguoi: ds.length,
           chuaCo: ds.filter(u => !statsOf(u.id, ky).hasData).length,
           chuaTuyen: ds.filter(u => !u.trackId).length };
}

/* ---- TỰ ĐIỀN VÀO TỆP PHIẾU ----

   Đọc chính tệp .xlsx của phiếu, điền cột Điểm và cột Sự việc, rồi trả lại tệp
   đã điền. Không phải copy dán từng cột nữa.

   Bản đồ mã câu → dòng lấy từ sheet ẩn _chiMuc do file gốc tự sinh, nên app
   KHÔNG đoán số dòng. Nhưng vẫn kiểm chứng lại từng mã bằng nội dung ô A trước
   khi ghi: chèn hay xoá một dòng trong phiếu là bản đồ lệch ngay mà không ai
   báo, và ghi điểm vào nhầm dòng thì không ai nhận ra cho tới lúc trả lương. */

function coDocGhiExcel(){ return typeof ExcelJS !== "undefined" && !!ExcelJS.Workbook; }

async function dienVaoPhieu(file, uid, ky){
  const wb = new ExcelJS.Workbook();
  await wb.xlsx.load(await file.arrayBuffer());

  const ci = wb.getWorksheet("_chiMuc");
  if (!ci) throw new Error("Tệp này không có sheet _chiMuc, nên không biết mã câu nào ở dòng nào. " +
                           "Chọn đúng tệp phiếu tháng do file gốc tạo ra.");

  // Tháng lấy từ kỳ: 2026-09 → T09
  const thang = "T" + String(ky).split("-")[1];
  const ws = wb.getWorksheet(thang);
  if (!ws) throw new Error("Tệp này không có sheet " + thang + ". Kiểm lại kỳ đang chọn.");

  let cotMa = 1, cotDiem = 3, cotSuViec = 5;
  const banDo = {};
  ci.eachRow(row => {
    const k = String(row.getCell(1).value || "").trim();
    if (k === "cot_ma")      cotMa     = Number(row.getCell(3).value) || cotMa;
    if (k === "cot_diem")    cotDiem   = Number(row.getCell(3).value) || cotDiem;
    if (k === "cot_su_viec") cotSuViec = Number(row.getCell(3).value) || cotSuViec;
    const d = Number(row.getCell(2).value);
    const muc = String(row.getCell(3).value || "").trim();
    if (k && d && /^[IVX]+$/.test(muc)) banDo[k] = d;
  });
  if (!Object.keys(banDo).length)
    throw new Error("Sheet _chiMuc không có bản đồ mã câu. Tệp có thể thuộc phiên bản cũ.");

  const u = user(uid);
  const st = statsOf(uid, ky);
  const bc = {}; bangChung(uid, ky).forEach(r => { bc[r.ma] = r.noiDung; });
  const diemTheoMa = {};
  criteriaFor(u).forEach(c => {
    const d = st && st.diemCau ? st.diemCau[c.id] : null;
    if (d) diemTheoMa[c.code] = d.diem;
  });

  /* Ba rổ khác nhau cho ba lý do không điền, vì cách xử lý cũng khác nhau:
       boRG      ranh giới và bảo mật — cố ý để hội đồng tự đánh
       khacNguoi app CÓ câu này nhưng không áp cho người đang chọn. Chuyện
                 thường: phiếu dựng riêng cho một người, đem dùng cho người
                 khác tuyến hay khác cấp thì lệch là đúng.
       khongCo   app KHÔNG có câu này. Đây mới là thứ phải đi sửa — bộ tiêu chí
                 trong app đang thiếu so với phiếu. */
  const coTrongKho = {};
  (DB.criteria || []).forEach(c => { coTrongKho[c.code] = true; });

  let daGhi = 0; const boRG = [], lech = [], khongCo = [], khacNguoi = [];
  Object.keys(banDo).forEach(ma => {
    const r = banDo[ma];
    // Bản đồ chỉ là gợi ý — ô A của dòng đó phải ĐÚNG LÀ mã ấy mới ghi.
    if (String(ws.getCell(r, cotMa).value || "").trim() !== ma){ lech.push(ma); return; }
    if (/^(RG|BM)/i.test(ma)){ boRG.push(ma); return; }
    if (diemTheoMa[ma] === undefined){
      (coTrongKho[ma] ? khacNguoi : khongCo).push(ma);
      return;
    }
    ws.getCell(r, cotDiem).value = diemTheoMa[ma];
    if (bc[ma]) ws.getCell(r, cotSuViec).value = bc[ma];
    daGhi++;
  });

  /* ⛔ HAI VIỆC BẮT BUỘC TRƯỚC KHI GHI RA.
     Tệp .xlsx lưu kèm KẾT QUẢ CŨ của mỗi ô công thức. Điền điểm mới mà để
     nguyên phần đó thì mở lên vẫn thấy điểm tổng và bậc của lần trước — con số
     sai mà trông như thật. Nên xoá hết kết quả cũ, và bật cờ buộc tính lại
     ngay khi mở. */
  wb.calcProperties = wb.calcProperties || {};
  wb.calcProperties.fullCalcOnLoad = true;
  wb.eachSheet(s => s.eachRow(row => row.eachCell({ includeEmpty: false }, c => {
    if (c.formula !== undefined && c.value && typeof c.value === "object" && "result" in c.value)
      c.value = { formula: c.formula, result: undefined };
  })));

  const buf = await wb.xlsx.writeBuffer();
  return { buf, daGhi, boRG, lech, khongCo, khacNguoi, thang,
           tong: Object.keys(banDo).length,
           ten: (u || {}).name || "", ma: (u || {}).code || "" };
}

/* ---- XUẤT ĐIỂM THEO MẪU PHIẾU ----

   này gõ hộ: ra ba cột Mã · Điểm · Bằng chứng, dán thẳng vào phiếu hoặc dùng
   VLOOKUP theo mã câu.

   ⛔ KHÔNG có RG và BM. Ranh giới thì vi phạm là chặn cả hai kết quả, bảo mật
   thì hạ một bậc — hai thứ đó nặng hơn hẳn phần còn lại và phải do hội đồng

/* Cho xem vài dòng đầu trước khi tải, để bắt lỗi chọn nhầm kỳ ngay tại chỗ. */
function veXemTruocBangLuong(){
  const o = $("#bl-ket"); if (!o) return;
  const ky = $("#bl-ky").value;
  const cfg = scoreCfg();
  const ds = nhanSuThat(daTich("bl-thu"));
  const coDL = ds.filter(u => statsOf(u.id, ky).hasData).length;

          h + "</th>").join("") + "</tr>" +

/* Đưa tệp cho người dùng lưu về máy. Nền tảng có cửa riêng cho việc này —
   trang tự gọi tải xuống thì bị chặn im lặng, nên phải đi qua cửa đó. */
async function luuTepVeMay(ten, buf){
  let cua = null;
  try{
    if (window.claude && typeof window.claude.use === "function")
      cua = await window.claude.use("downloads");
  }catch(e){}

  if (cua && typeof cua.save === "function"){
    // Không rõ cửa nhận kiểu dữ liệu nào — thử lần lượt, dừng ở cái đầu tiên chạy được.
    const thu = [
      () => cua.save({ filename: ten, data: new Blob([buf],
        { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }) }),
      () => cua.save({ filename: ten, data: new Uint8Array(buf) }),
      () => cua.save({ filename: ten, data: buf })
    ];
    for (const t of thu){
      try{ await t(); return '<b>Tệp đã sẵn sàng</b> — cửa sổ lưu về máy vừa hiện lên.'; }
      catch(e){ /* thử kiểu tiếp theo */ }
    }
    return '<span style="color:var(--bad)">Không lưu được tệp về máy. ' +
           'Dùng cách copy dán bên dưới giúp em.</span>';
  }
  return '<span style="color:var(--warn)">Trang này chưa được cấp quyền lưu tệp về máy. ' +
         'Dùng cách copy dán bên dưới giúp em.</span>';
}

function veXuatDiem(){
  const o = $("#xd-ket"); if (!o) return;
  const uid = $("#xd-user").value, ky = $("#xd-ky").value;
  const u = user(uid);
  if (!u){ o.innerHTML = '<div class="card empty" style="padding:22px">Chưa chọn được người.</div>'; return; }

  const st = statsOf(uid, ky);
  if (!st || !st.diemCau){
    o.innerHTML = '<div class="card empty" style="padding:22px">Kỳ này chưa tính được điểm.</div>';
    return;
  }
  const bc = {};
  bangChung(uid, ky).forEach(r => { bc[r.ma] = r.noiDung; });

  const dong = [];
  criteriaFor(u).forEach(c => {
    const d = st.diemCau[c.id];
    if (!d) return;
    dong.push([c.code, d.diem, bc[c.code] || ""]);
  });
  if (!dong.length){
    o.innerHTML = '<div class="card empty" style="padding:22px">Người này chưa có câu nào áp dụng.</div>';
    return;
  }
  const coSuViec = dong.filter(x => x[2]).length;
  const theoMa = {};
  dong.forEach(r => { theoMa[r[0]] = { diem: r[1], bc: r[2] }; });

  const dau =
    '<p class="tiny muted" style="margin:0 0 8px"><b>' + dong.length + '</b> câu áp cho ' + esc(u.name) +
      ', trong đó ' + coSuViec + ' câu có sự việc trong kỳ. ' +
      'Điểm tổng <b>' + (st.raw == null ? "—" : Number(st.raw).toFixed(2)) + "/" +
        (st.thangPhieu || 5) + '</b>' +
      (st.tyLeCuoi == null ? "" : " · đạt " + st.tyLeCuoi.toFixed(1) + "%") +
      (st.bac ? " · bậc <b>" + st.bac + "</b>" : "") + '.</p>';

  const cuoi =
    '<p class="tiny muted" style="margin:8px 0 0">⛔ Mã <b>RG</b> và <b>BM</b> luôn để trống: ranh giới ' +
      'và bảo mật thu nhập do hội đồng tự đánh, vì vi phạm ở đó chặn cả hai kết quả hoặc hạ một bậc.</p>';

  /* CHƯA DÁN CỘT A: đưa bảng ba cột để dùng VLOOKUP. */
  const maDan = ($("#xd-ma") ? $("#xd-ma").value : "").replace(/\r/g, "");
  if (!maDan.trim()){
    o.innerHTML = dau +
      '<div class="card pad" style="background:var(--surface-2)">' +
        '<div class="tiny muted" style="margin-bottom:6px">Chưa dán cột A. Tạm đưa bảng tra cứu — ' +
          'dán vào một vùng trống rồi VLOOKUP theo mã câu.</div>' +
        '<textarea class="input" id="xd-text" style="min-height:150px;font-family:ui-monospace,monospace;font-size:11.5px"></textarea>' +
        '<div class="tiny muted" style="margin-top:6px">Cột C: <code>=IFERROR(VLOOKUP($A39;vùng;2;0);"")</code>' +
          ' · cột E: đổi số 2 thành 3.</div>' +
      "</div>" + cuoi;
    const oT = $("#xd-text");
    if (oT) oT.value = ["Mã\tĐiểm\tSự việc"]
      .concat(dong.map(r => r[0] + "\t" + r[1] + "\t" + r[2])).join("\n");
    return;
  }

  /* ĐÃ DÁN CỘT A: trả lại ĐÚNG từng ấy dòng, để copy một phát dán thẳng vào
     cột C và cột E. Không đụng cột B (nội dung câu) và cột D (công thức đếm
     biên bản) — dán đè lên hai cột đó là hỏng phiếu. */
  const maDs = maDan.split("\n").map(x => x.trim());
  const cotDiem = [], cotSuViec = [];
  let khop = 0, laMa = 0;
  maDs.forEach(ma => {
    if (!ma){ cotDiem.push(""); cotSuViec.push(""); return; }
    if (/^(RG|BM)/i.test(ma)){ laMa++; cotDiem.push(""); cotSuViec.push(""); return; }
    const t = theoMa[ma];
    if (t){ khop++; laMa++; cotDiem.push(t.diem); cotSuViec.push(t.bc); }
    else   { cotDiem.push(""); cotSuViec.push(""); }
  });
  const laMaKhongKhop = maDs.filter(m => m && /^[A-Z]{1,3}\d/i.test(m) && !/^(RG|BM)/i.test(m) && !theoMa[m]);

  o.innerHTML = dau +
    '<div class="tiny muted" style="margin:0 0 8px"><b>Bước 2.</b> Nhận đúng <b>' + maDs.length +
      '</b> dòng, khớp được <b>' + khop + '</b> câu. Copy từng ô rồi dán vào phiếu — ' +
      'dán vào <b>đúng ô đầu tiên</b> của dải vừa bôi đen.</div>' +
    (laMaKhongKhop.length
      ? '<div class="card pad" style="background:var(--warn-soft);margin-bottom:10px">' +
        '<div class="tiny" style="color:var(--warn)"><b>' + laMaKhongKhop.length +
        ' mã trên phiếu không có trong app</b>, để trống: ' +
        esc(laMaKhongKhop.slice(0, 12).join(", ")) + (laMaKhongKhop.length > 12 ? "…" : "") +
        '. Người này có thể khác tuyến với phiếu đang mở.</div></div>'
      : "") +
    '<div class="row" style="gap:10px;align-items:stretch;flex-wrap:wrap">' +
      '<div style="flex:1;min-width:120px">' +
        '<div class="tiny muted" style="margin-bottom:4px">→ dán vào <b>cột C</b> · Điểm</div>' +
        '<textarea class="input" id="xd-text" style="min-height:190px;font-family:ui-monospace,monospace;font-size:11.5px"></textarea>' +
      "</div>" +
      '<div style="flex:2;min-width:180px">' +
        '<div class="tiny muted" style="margin-bottom:4px">→ dán vào <b>cột E</b> · Sự việc</div>' +
        '<textarea class="input" id="xd-text2" style="min-height:190px;font-family:ui-monospace,monospace;font-size:11.5px"></textarea>' +
      "</div>" +
    "</div>" +
    '<div class="row" style="gap:8px;margin-top:8px">' +
      '<button class="btn sm" data-act="xd-chon">Chọn cột C</button>' +
      '<button class="btn sm" data-act="xd-chon2">Chọn cột E</button>' +
    "</div>" + cuoi;

  /* ⛔ ĐẶT NỘI DUNG BẰNG .value, KHÔNG NHÉT VÀO HTML.
     HTML quy định textarea bỏ đúng một ký tự xuống dòng ngay sau thẻ mở. Dòng
     đầu của hai cột này thường rỗng — dòng 25 của phiếu là chữ "#" chứ không
     phải mã câu — nên nhét qua HTML là mất dòng đầu, và mọi điểm dán vào phiếu
     lệch lên một ô. Sai kiểu đó không ai nhìn ra, tới lúc trả lương mới biết. */
  const oC = $("#xd-text"), oE = $("#xd-text2");
  if (oC) oC.value = cotDiem.join("\n");
  if (oE) oE.value = cotSuViec.join("\n");
}

    '<button class="btn primary" style="width:100%" data-act="do-import">Nhập & thay thế</button>');
}
async function doImport(){
  try{
    const d = JSON.parse($("#imp").value);
    if (!d || !Array.isArray(d.users) || !Array.isArray(d.criteria)) throw new Error("Thiếu users/criteria");
    DB = Object.assign({ version:3, sites:[], depts:[], tracks:[], users:[], criteria:[], reviews:[], settings:{} }, d);
    for (const u of DB.users){
      if (!u.pwHash || !u.pwSalt) await setPw(u, DEFAULT_PW, true);
      if (!u.level) u.level = u.role === "admin" ? "clevel" : u.role === "manager" ? "head" : "staff";
      u.role = roleFromLevel(u.level);
    }
    const still = DB.users.find(u => ME && u.code === ME.code);
    ME = still || null; setSession(ME);
    await persist(); closeModal(); render(); toast("Đã nhập dữ liệu.");
  }catch(e){ toast("JSON không hợp lệ: " + e.message); }
}

(async function boot(){
 try{
  const saved = await Storage.load();
  // Bản trước dùng danh sách demo (ADMIN/QL01/NS01). Dữ liệu cũ hơn phiên bản 3
  // là dữ liệu demo, thay hẳn bằng danh sách nhân sự thật.
  const stale = saved && (!saved.version || saved.version < 3);
  const fresh = !(saved && Array.isArray(saved.users) && saved.users.length) || stale;
  DB = fresh ? await seed() : saved;

  // Nâng cấp dữ liệu cũ sang cấu trúc mới (phòng ban / tuyến / cấp bậc / mật khẩu).
  DB.depts  = DB.depts  || [];
  DB.tracks = DB.tracks || [];
  let migrated = 0;
  for (const u of DB.users){
    if (!u.pwHash || !u.pwSalt){ await setPw(u, DEFAULT_PW, true); migrated++; }
    if (!u.level){
      u.level = u.role === "admin" ? "clevel" : u.role === "manager" ? "head" : "staff";
      migrated++;
    }
    u.role = roleFromLevel(u.level);
    if (u.titleVi === undefined) u.titleVi = u.position || "";
    if (u.titleEn === undefined) u.titleEn = "";
    if (u.deptId  === undefined) u.deptId  = null;
    if (u.trackId === undefined) u.trackId = null;
    if (u.hearing === undefined) u.hearing = "";
    delete u.position;
  }
  // Cập nhật bộ khung khi có bản mới, nhưng giữ nguyên tài khoản, mật khẩu và đánh giá đã chấm.
  DB.records = DB.records || [];
  const FRAME = 7;
  if (!DB.users.some(u => String(u.code).toUpperCase() === "ADMIN")) DB.users.unshift(buildAdmin());
  if (!DB.users.some(u => u.demo)){ DB.users.push(await buildDemo()); migrated++; }
  if (!DB.users.some(u => String(u.code).toUpperCase() === "ADMIN_TEST")){
    const iAd = DB.users.findIndex(u => u.id === "u_admin");
    DB.users.splice(iAd >= 0 ? iAd + 1 : 0, 0, buildAdminTest());
    migrated++;
  }
  if ((DB.settings.frame || 0) < FRAME){
    DB.criteria = buildCriteria();
    DB.tracks   = buildTracks();
    DB.boundaries = { common:RANH_CHUNG, byTrack:RANH_TUYEN };
    DB.users.forEach(u => { if (!u.trackId && u.deptId === "dp_comm") u.trackId = "tr_comm"; });
    DB.settings.frame = FRAME;
    migrated++;
  }
  if (!DB.settings.demoSeeded){ seedDemoActivity(); DB.settings.demoSeeded = true; migrated++; }
  // Bản ghi mẫu cũ gắn vào câu khung chung nên không còn tính điểm. Dựng lại vào B.2.
  if (DB.settings.demoSeeded !== "cogio"){
    const dm = DB.users.find(u => u.demo);
    if (dm){
      DB.records = recs().filter(r => r.subjectId !== dm.id);
      DB.reviews = DB.reviews.filter(r => r.revieweeId !== dm.id);
      seedDemoActivity();
    }
    DB.settings.demoSeeded = "cogio"; migrated++;
  }
  // Chuyển bản ghi cũ sang cơ chế hai chữ ký.
  if (!DB.settings.haiChuKy){
    const hr = ((DB.depts||[]).find(d => /nh[âa]n s[ựu]/i.test(d.name)) || {}).id;
    const nsHead = DB.users.find(u => u.deptId === hr && isManager(u));
    recs().forEach(r => {
      if (r.kyQL || r.kyNS) return;
      if (r.status === "approved"){
        r.kyQL = { by: r.decidedBy || r.reporterId, at: r.decidedAt || r.createdAt };
        r.kyNS = { by: (nsHead && nsHead.id) || "u_admin", at: r.decidedAt || r.createdAt };
      } else {
        r.kyQL = null; r.kyNS = null;
      }
      if (r.status === "rejected" && !r.tuChoi)
        r.tuChoi = { by: r.decidedBy || "u_admin", at: r.decidedAt || r.createdAt };
      if (r.khieuNai === undefined) r.khieuNai = null;
    });
    DB.settings.haiChuKy = true; migrated++;
  }

  // Quy định mới: chỉ từ Quản lý trở lên mới lập bản ghi. Sửa lại người lập của dữ liệu mẫu.
  if (!DB.settings.recFilerFixed){
    const thay = { u_TTX006:"u_TTX003", u_TTX007:"u_TTX003" };
    recs().forEach(r => { if (thay[r.reporterId]) r.reporterId = thay[r.reporterId]; });
    DB.settings.recFilerFixed = true; migrated++;
  }
  if (fresh || migrated) await Storage.save(DB);

  ME = readSession();
  render();
  if (migrated && !ME) {
    const el = $("#loginerr");
    if (el) el.textContent = "Hệ thống vừa bật đăng nhập bằng mật khẩu. Mật khẩu tạm: " + DEFAULT_PW;
  }

  /* Người khác lập hay duyệt biên bản thì hiện một thanh mời cập nhật.
     ⚠️ Cố ý KHÔNG tự vẽ lại: ai đang gõ dở một biên bản sẽ mất chữ đang viết. */
  Storage.ngheSoSuViec(() => {
    if ($("#co-cai-moi")) return;
    const t = document.createElement("div");
    t.id = "co-cai-moi";
    t.setAttribute("style",
      "position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:9999;" +
      "background:var(--brand);color:#fff;border-radius:999px;padding:9px 16px;" +
      "box-shadow:var(--shadow);font-size:14px;display:flex;gap:10px;align-items:center");
    t.innerHTML = '<span>Có biên bản mới từ người khác</span>' +
      '<button type="button" id="nut-cai-moi" style="background:#fff;color:var(--brand-ink);' +
      'border:0;border-radius:999px;padding:4px 12px;font-weight:600">Cập nhật</button>';
    document.body.appendChild(t);
    /* Tải lại cả trang chứ không chỉ đọc lại DB: phần nâng cấp dữ liệu cũ nằm
       ngay trong luồng khởi động, không tách ra thành hàm riêng được. Phiên
       đăng nhập nằm trong localStorage nên không phải đăng nhập lại. */
    const nut = $("#nut-cai-moi");
    if (nut) nut.addEventListener("click", () => { location.reload(); });
  });

 }catch(err){
  // Không để màn hình trắng: hiện lỗi ra để còn biết đường sửa.
  document.getElementById("app").innerHTML =
    '<div class="login"><div class="login-card card pad">' +
      '<h2 style="color:var(--bad)">App không khởi động được</h2>' +
      '<p class="tiny muted" style="margin:8px 0 0">' + esc(String(err && err.message || err)) + "</p>" +
      '<p class="tiny muted" style="margin:8px 0 0">Thử tải lại trang. Nếu vẫn lỗi, gửi ảnh chụp dòng chữ này.</p>' +
    "</div></div>";
  try{ console.error(err); }catch(e){}
 }
})();
</script>
